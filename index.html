<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17795a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Haushaltsbudget</title>
<style>
:root{
  --bg:#edf0f3; --panel:#ffffff; --ink:#15202b; --muted:#667585; --line:#dde3e9; --soft:#f5f7f9;
  --accent:#17795a; --accent-d:#0f5c44; --accent-bg:#e4f3ec;
  --nic:#2563c9; --nic-bg:#e8effc; --van:#d4601a; --van-bg:#fcece1;
  --ein:#f6e7b4; --steu:#fbe4d3; --red:#c0392b; --blue-chip:#dbe7fb;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f151b;--panel:#18212a;--ink:#e8eef3;--muted:#92a2b1;--line:#27333f;--soft:#1d2833;--accent:#3fbf93;--accent-d:#2ea77d;--accent-bg:#17382d;--nic:#6aa0f0;--nic-bg:#1c2b47;--van:#f19a62;--van-bg:#43291a;--ein:#4a4018;--steu:#46301f;--blue-chip:#1d3050}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,.kv2,td,.amt{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(90deg,var(--nic) 50%,var(--van) 50%);display:inline-block}
aside.side button.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:9px;background:none;width:100%;text-align:left;color:var(--muted);font-weight:550}
aside.side button.nv .i{width:20px;text-align:center;font-size:17px}
aside.side button.nv:hover{background:var(--soft);color:var(--ink)}
aside.side button.nv.on{background:var(--accent-bg);color:var(--accent-d);font-weight:650}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);word-break:break-all}
.side .foot b{color:var(--ink);display:block;font-weight:600}
main.main{padding:22px 28px 70px;min-width:0;max-width:1320px;width:100%}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:24px;margin:0 auto 0 0;letter-spacing:-.02em}
.mnav{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mnav button{border:0;background:none;padding:8px 13px;font-size:18px;color:var(--accent)}
.mnav button:hover{background:var(--soft)}
.mnav .lab{position:relative;min-width:150px;text-align:center;font-weight:650;padding:0 6px}
.mnav .lab input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:7px;color:var(--muted);font-weight:550}
.seg button.on{background:var(--ink);color:var(--panel)}
.seg button.on.nj{background:var(--nic);color:#fff}.seg button.on.vs{background:var(--van);color:#fff}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.pill.ok{color:var(--accent-d);border-color:var(--accent)}
.frozen{display:inline-block;font-size:11px;background:var(--blue-chip);color:var(--nic);border-radius:99px;padding:1px 9px;margin-left:8px;font-weight:600}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.panel>h2,.panel .ph h2{font-size:15px;margin:0 0 12px;font-weight:700;letter-spacing:-.005em}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph h2{margin:0!important}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.two>*{min-width:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;border-top:3px solid var(--line)}
.kpi.ein{border-top-color:#e0b72f}.kpi.mon,.kpi.einm{border-top-color:#79b35b}.kpi.steuer{border-top-color:#ed7d31}.kpi.spar{border-top-color:var(--accent);background:var(--accent-bg)}
.kpi .kl{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .kv2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:3px 0 2px;white-space:nowrap}
.kpi.spar .kv2{font-size:26px}
.kpi .ks{font-size:12px;color:var(--muted);white-space:nowrap}
.kpi .ks .n{color:var(--nic);font-weight:600}.kpi .ks .v{color:var(--van);font-weight:600}
.neg{color:var(--red)}

/* Ledger: Nicola | Vanessa */
table.ledger{width:100%;border-collapse:collapse}
table.ledger th{font-size:13px;padding:8px 10px;text-align:right;font-weight:700}
table.ledger th:first-child{text-align:left}
table.ledger th.n{color:var(--nic);background:var(--nic-bg);border-radius:8px 8px 0 0}
table.ledger th.v{color:var(--van);background:var(--van-bg);border-radius:8px 8px 0 0}
table.ledger td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
table.ledger td:first-child{text-align:left;font-weight:550}
table.ledger td.n{background:color-mix(in srgb,var(--nic-bg) 55%,transparent)}
table.ledger td.v{background:color-mix(in srgb,var(--van-bg) 55%,transparent)}
table.ledger td.h{font-weight:650}
table.ledger tr.spar td{font-weight:700;border-bottom:0;font-size:15px}
table.ledger tr.spar td:first-child{color:var(--accent-d)}
table.ledger small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}

/* Category bars */
.bars .row{display:grid;grid-template-columns:140px 1fr 84px;gap:10px;align-items:center;padding:5px 0}
.bars .track{height:9px;background:var(--soft);border-radius:5px;overflow:hidden;display:flex}
.bars .track i{display:block;height:100%}
.bars .amt{text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Payment lists */
.pl-head{display:flex;justify-content:space-between;font-weight:700;padding:6px 0 8px;border-bottom:2px solid var(--line);margin-bottom:4px}
.pl-head.n{color:var(--nic);border-color:var(--nic)}.pl-head.v{color:var(--van);border-color:var(--van)}
.pl-cat{font-size:12.5px;color:var(--muted);font-weight:650;padding:10px 0 3px;display:flex;justify-content:space-between}
.pl{display:flex;justify-content:space-between;gap:10px;padding:5px 6px;border-radius:7px;cursor:pointer}
.pl:hover{background:var(--soft)}
.pl .num{white-space:nowrap}
.pl .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .t small{color:var(--muted);margin-left:6px;font-size:11.5px}
.pl.nolink{cursor:default}

/* Hints */
.hl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.hl:last-child{border:0}
.hl .ic{font-size:17px;line-height:1.3}

/* Buttons & forms */
.btn{border:0;background:var(--accent);color:#fff;padding:9px 15px;border-radius:9px;font-weight:600}
.btn:hover{background:var(--accent-d)}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--soft)}
.btn.danger{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions .grow{flex:1}
.ib{border:0;background:none;padding:5px 7px;border-radius:7px;color:var(--muted);font-size:15px}
.ib:hover{background:var(--soft);color:var(--ink)}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input:hover,select:hover{border-color:var(--muted)}
input[type=checkbox]{width:auto}
.err{color:var(--red);font-size:13px;margin:4px 0}

/* Entries table */
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fbar input[type=search]{max-width:240px}
.fbar select{width:auto}
.egroup{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.eg-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-weight:700}
.eg-h .sum{font-weight:600;color:var(--muted);margin-right:10px}
.erow,.ehead{display:grid;grid-template-columns:minmax(150px,2.3fr) 1.05fr 1.05fr .95fr 1.1fr 1.1fr .85fr .85fr 74px;gap:8px;align-items:center;padding:5px 14px}
.ehead{font-size:12px;color:var(--muted);font-weight:650;padding-top:8px;padding-bottom:2px}
.ehead .r,.erow .num{text-align:right}
.erow{border-bottom:1px solid var(--line)}
.erow:last-of-type{border-bottom:0}
.erow input,.erow select{border-color:transparent;background:transparent;padding:6px 7px}
.erow input:hover,.erow select:hover{border-color:var(--line)}
.erow input:focus,.erow select:focus{background:var(--panel);border-color:var(--accent)}
.erow.past,.erow.future{opacity:.55}
.erow .lb{display:none}
.erow .dim{color:var(--muted)}
.erow .act{display:flex;justify-content:flex-end}
.erow .art select{font-weight:600}
.erow[data-art=Monatlich] .art select{color:var(--accent-d)}
.erow[data-art=Einmalig] .art select{color:var(--nic)}
.erow[data-art=Jährlich] .art select{color:#c2631d}
.erow[data-art=Lohn] .art select{color:#9a7a05}
.eg-add{padding:8px 14px}
.who-NJ select{color:var(--nic);font-weight:600}.who-VS select{color:var(--van);font-weight:600}

/* Löhne / Tables */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:650}
table.t tr.cur td{background:var(--ein);font-weight:650}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--line)}
table.t tr.fut td{color:var(--muted)}
.scroll{overflow-x:auto}
.lohn-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line)}
.lohn-row.cur{background:var(--ein);border-radius:8px}
.lohn-row input{text-align:right}
.lohn-row input::placeholder{color:var(--muted);opacity:.75}
.lohn-head{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;font-size:12px;color:var(--muted);padding:0 8px 6px;font-weight:650}
.lohn-head span:nth-child(n+2){text-align:right;padding-right:10px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:14px}
svg.chart line{stroke:var(--line)}

/* Modal */
#modal{position:fixed;inset:0;display:none;background:rgba(10,16,22,.5);z-index:50;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px;padding:20px}
.sheet.wide{max-width:860px}
.sheet h3{margin:0 0 12px;font-size:18px}
label.f{display:block;margin-bottom:11px;font-size:12.5px;font-weight:650;color:var(--muted)}
label.f input,label.f select{display:block;margin-top:4px;font-size:15px;color:var(--ink);font-weight:400}
.two-c{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 1fr 34px;gap:6px;margin-bottom:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:#1b2630;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.on{opacity:.96}
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:20px}
.center .panel{max-width:520px;width:100%;text-align:left}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:12px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.kvrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kvrow:last-child{border:0}

/* Mobil */
@media (max-width:899px){
  .shell{display:block}
  aside.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:5px 6px calc(5px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30;gap:0}
  .logo,.side .foot{display:none}
  aside.side button.nv{flex-direction:column;gap:1px;padding:5px 2px;font-size:11px;justify-content:center;align-items:center;text-align:center}
  main.main{padding:14px 12px 96px}
  .topbar h1{font-size:20px;width:100%}
  .kpis{grid-template-columns:1fr 1fr}.kpi.spar{grid-column:1/-1}
  .dgrid,.two{grid-template-columns:1fr}
  .bars .row{grid-template-columns:105px 1fr 70px}
  .ehead{display:none}
  .erow{grid-template-columns:1fr 1fr;padding:10px 12px;row-gap:4px;border-bottom:1px solid var(--line)}
  .erow .c.name{grid-column:1/-1}
  .erow .lb{display:block;font-size:11px;color:var(--muted);font-weight:600;padding-left:7px}
  .erow input,.erow select{border-color:var(--line)}
  .erow .c.an,.erow .c.av{text-align:left}
  .erow .c.act{grid-column:1/-1;justify-content:flex-end}
  .frow{grid-template-columns:1fr 1fr}
  .mnav .lab{min-width:130px}
  #toast{bottom:90px}
}

.mrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow .m{flex:1;min-width:0}.mrow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mrow .s{font-size:12px;color:var(--muted)}
.mrow .a{text-align:right;font-weight:650;white-space:nowrap}.mrow .a small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.mrow.off{opacity:.55}

/* Bewegung: nur als Antwort auf Aktionen (Monat/Tab wechseln, Speichern, Dialog öffnen) */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
@keyframes sheetin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.anim main.main>*{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.anim main.main>*:nth-child(2){animation-delay:.04s}.anim main.main>*:nth-child(3){animation-delay:.08s}.anim main.main>*:nth-child(4){animation-delay:.12s}
.anim .track i{transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--r,0)*45ms + .15s)}
.anim svg.chart rect{transform-box:fill-box;transform-origin:50% 100%;animation:barup .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*25ms + .1s)}
.erow.flash{animation:flash 1.1s ease-out}
#modal.on{animation:fade .15s ease-out}
#modal.on .sheet{animation:sheetin .22s cubic-bezier(.2,.8,.2,1)}
#toast{transform:translate(-50%,10px);transition:opacity .25s,transform .25s}
#toast.on{transform:translate(-50%,0)}
.btn,.seg button,aside.side button.nv,.pl,.mrow,.ib,.mnav button{transition:background-color .15s,color .15s,border-color .15s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* --- Rollen / Protokoll / Druck --- */
.lohn-row.one,.lohn-head.one{grid-template-columns:1.2fr 1fr}
.logrow{display:grid;grid-template-columns:78px 62px 82px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.logrow:last-of-type{border-bottom:0}
.logrow .lt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.logrow .lw{font-weight:650;font-size:12px}.logrow .lw.n{color:var(--nic)}.logrow .lw.v{color:var(--van)}
.logrow .la{font-weight:600}
.logrow .lx{color:var(--muted);overflow-wrap:anywhere}
@media(max-width:620px){.logrow{grid-template-columns:70px 1fr}.logrow .la{grid-column:2}.logrow .lx{grid-column:1/-1}}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;background:#fff;font:12px/1.4 system-ui,Arial,sans-serif;padding:0}
  #print h1{font-size:20px;margin:0 0 2px}#print .sub{margin:0 0 14px;color:#555}
  #print h2{font-size:14px;margin:16px 0 6px}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{padding:4px 6px;border-bottom:1px solid #ccc;text-align:left}
  #print .r,#print th.r{text-align:right}
  #print tr.tot td{font-weight:700;border-top:2px solid #000}
  html,body{background:#fff!important}
}
</style>
</head>

const MK = (y,m) => y*12+m;
const ymOf = k => ({y:Math.floor((k-1)/12), m:(k-1)%12+1});
const label = k => { const {y,m}=ymOf(k); return MONTHS[m-1]+' '+y; };
const short = k => { const {y,m}=ymOf(k); return String(m).padStart(2,'0')+'.'+y; };
const toInput = k => { if(k==null) return ''; const {y,m}=ymOf(k); return y+'-'+String(m).padStart(2,'0'); };

function buildS(c, role){
  const lohn={};
  if(role!=='v') for(const [k,o] of Object.entries(c.lohn)){ lohn[k]={n:o.n}; if(o.v!==undefined && !c.lohnV[k]) lohn[k].v=o.v; }   // v im alten lohn-Dokument = Altbestand

  let entries=Object.entries(c.entries).map(([id,o])=>({...o,id}));
  if(role==='v') entries=entries.filter(e=>e.wer==='VS'||e.wer==='50/50');
  let frozen={};
  if(role==='v') for(const [k,o] of Object.entries(c.frozenV)) frozen[k]={key:o.key,items:o.items||[],lohnN:0,lohnV:o.lohnV||0,at:o.at};
  else frozen={...c.frozen};
  return {entries, lohn, frozen, frozenV:{...c.frozenV}, settings:c.settings.main||{}, rawLohn:{...c.lohn}, rawLohnV:{...c.lohnV},
    log:role==='v'?[]:Object.entries(c.log).map(([id,o])=>({...o,id})).sort((a,b)=>b.at-a.at)};

  data = {...emptyCache(), ...(data||{})};
  const role = lsGet('budget_role','admin')==='v' ? 'v' : 'admin';
  const save = () => lsSet(KEY, JSON.stringify(data));
  const emit = () => b.onData(buildS(data, role));
  const b = {
    mode:'local', role, by: role==='v'?'lokal (Vanessa)':'lokal (Admin)',
    async start(onData){ b.onData=onData; emit(); b.onReady(); },
    async set(col,id,obj){ data[col][id]=obj; save(); emit(); },
    async del(col,id){ delete data[col][id]; save(); emit(); },
    async batch(ops){ for(const op of ops){ if(op.del) delete data[op.col][op.id]; else data[op.col][op.id]=op.obj; } save(); emit(); },
    async signOut(){},
  };
  return b;
}

async function FirebaseBackend(cfg){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, A, F] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  let db;
  try{ db = F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }
  catch{ db = F.getFirestore(app); }
  const cache = emptyCache();
  const loaded = {};
  const emit = () => b.onData(buildS(cache, b.role));
  const ref = (col,id) => F.doc(db,'households',HOUSEHOLD,col,id);
  const clean = o => JSON.parse(JSON.stringify(o));
  let unsubs=[];
  const b = {
    mode:'firebase', user:null, role:'v', by:'',
    onAuth(cb){ A.onAuthStateChanged(auth, u => { b.user=u; b.by=u?u.email:''; b.role=(u&&u.email===ADMIN_EMAIL)?'admin':'v'; cb(u); }); },
    async signIn(){
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      try{ await A.signInWithPopup(auth,p); }
      catch(e){ if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)) await A.signInWithRedirect(auth,p); else throw e; }
    },
    async signOut(){ unsubs.forEach(u=>u()); unsubs=[]; await A.signOut(auth); },
    async start(onData,onError){
      b.onData=onData;
      const adm=b.role==='admin';
      const cols = adm ? ['entries','lohn','lohnV','frozen','frozenV','settings','log'] : ['entries','lohnV','frozenV','settings'];
      for(const col of cols){
        const c = F.collection(db,'households',HOUSEHOLD,col);
        /* Regeln sind keine Filter: Vanessas Abfrage muss die erlaubte Einschränkung selbst enthalten */
        const q = col==='entries' && !adm ? F.query(c, F.where('wer','in',['VS','50/50']))
                : col==='log' ? F.query(c, F.orderBy('at','desc'), F.limit(300)) : c;
        unsubs.push(F.onSnapshot(q, snap=>{
          snap.docChanges().forEach(ch=>{ if(ch.type==='removed') delete cache[col][ch.doc.id]; else cache[col][ch.doc.id]=ch.doc.data(); });
          loaded[col]=true; emit();
          if(cols.every(c=>loaded[c])) b.onReady();
        }, err=>onError&&onError(err)));
      }
    },
    async set(col,id,obj){ await F.setDoc(ref(col,id), clean(obj)); },
    async del(col,id){ await F.deleteDoc(ref(col,id)); },
    async batch(ops){
      for(let i=0;i<ops.length;i+=400){
        const wb=F.writeBatch(db);
        ops.slice(i,i+400).forEach(op=>op.del?wb.delete(ref(op.col,op.id)):wb.set(ref(op.col,op.id),clean(op.obj)));
        await wb.commit();
      }
    },
  };
  return b;
}

/* ============ Rechenlogik (wie in der Excel-Datei) ============ */
const shares = w => ({n: w==='NJ'?1:w==='50/50'?.5:0, v: w==='VS'?1:w==='50/50'?.5:0});
const cats = () => (S.settings.kats && S.settings.kats.length) ? S.settings.kats : CATS_DEFAULT;
function isActive(e,k){
  if(e.ab==null) return false;
  const end = e.art==='Einmalig' ? e.ab : (e.bis==null ? Infinity : e.bis);
  return e.ab<=k && k<=end;
}
function status(e,k){
  if(e.ab==null) return 'off';
  if(isActive(e,k)) return 'on';
  const end = e.art==='Einmalig' ? e.ab : (e.bis==null ? Infinity : e.bis);
  return end<k ? 'past' : 'future';
}
function monthlyAmount(e){ return e.art==='Jährlich' ? e.betrag/12 : e.betrag; }
function liveItems(k){
  return S.entries.filter(e=>isActive(e,k)).map(e=>{
    const m=monthlyAmount(e), s=shares(e.wer);
    return {id:e.id, art:e.art, kat:e.art==='Lohn'?'Lohn':e.kat, name:e.name, betrag:e.betrag, wer:e.wer, n:m*s.n, v:m*s.v};
  });
}
function lohnBase(k){
  let n=0,v=0,kn=-1,kv=-1;
  for(const [kk,o] of Object.entries(S.lohn)){
    const key=+kk; if(key>k) continue;
    if(o.n!=null && o.n!=='' && key>kn){ kn=key; n=+o.n; }
    if(o.v!=null && o.v!=='' && key>kv){ kv=key; v=+o.v; }
  }
  return {n,v};
}
function monthData(k){
  if(S.frozen[k]) return {...S.frozen[k], frozen:true};
  const l=lohnBase(k);
  return {key:k, items:liveItems(k), lohnN:l.n, lohnV:l.v, frozen:false};
}
function calc(md){
  const z=()=>({ein:0,mon:0,einm:0,steuer:0,spar:0});
  const N=z(), V=z(), cat={};
  N.ein=md.lohnN||0; V.ein=md.lohnV||0;
  for(const it of md.items){
    if(it.art==='Lohn'){ N.ein+=it.n; V.ein+=it.v; continue; }
    const f = it.art==='Monatlich'?'mon':it.art==='Einmalig'?'einm':'steuer';
    N[f]+=it.n; V[f]+=it.v;
    const c=(cat[it.kat]=cat[it.kat]||{n:0,v:0}); c.n+=it.n; c.v+=it.v;
  }
  for(const P of [N,V]) P.spar=P.ein-P.mon-P.einm-P.steuer;
  const H={}; for(const f of ['ein','mon','einm','steuer','spar']) H[f]=N[f]+V[f];
  return {N,V,H,cat};
}
function firstKey(){
  const ks=[...S.entries.filter(e=>e.ab!=null).map(e=>e.ab), ...Object.keys(S.lohn).map(Number)];
  return ks.length ? Math.min(...ks) : null;
}
/* Vergangene Monate werden automatisch eingefroren: spaetere Aenderungen/Loeschungen aendern sie nicht mehr. */
async function autoFreeze(){
  if(!ready || !backend) return;
  const f=firstKey(); if(f==null) return;
  const cur=nowKey(); const ops=[];
  for(let k=f;k<cur;k++){
    if(S.frozen[k] || (S.settings.unlocked||[]).includes(k)) continue;
    const l=lohnBase(k);
    if(isAdmin()){
      let items=liveItems(k), lohnV=l.v; const fv=S.frozenV[k];
      if(fv){ items=items.filter(i=>i.wer!=='VS').concat(fv.items.filter(i=>i.wer==='VS')); lohnV=fv.lohnV; }   // Vanessas eigener Stand bleibt massgebend
      const obj={key:k, items, lohnN:l.n, lohnV, at:Date.now()};
      S.frozen[k]=obj; ops.push({col:'frozen',id:String(k),obj});
      if(!fv) ops.push({col:'frozenV',id:String(k),obj:vView(obj)});
    } else {
      const obj={key:k, items:liveItems(k).map(i=>({...i,n:0})), lohnV:l.v, at:Date.now()};
      S.frozen[k]={...obj,lohnN:0}; ops.push({col:'frozenV',id:String(k),obj});
    }
  }
  if(ops.length) await backend.batch(ops);
}

/* ============ Diagramm ============ */
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function chart(labels, series){
  const W=640,H=200,pl=44,pr=6,pt=10,pb=24;
  const all=series.flatMap(s=>s.values);
  let max=Math.max(1,...all), min=Math.min(0,...all);
  const step=niceStep((max-min)/4||1); max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step;
  const y=v=>pt+(H-pt-pb)*(max-v)/((max-min)||1);
  const n=labels.length, gw=(W-pl-pr)/n, bw=Math.min(22,(gw-6)/series.length);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=min; v<=max+1e-9; v+=step){
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${Math.abs(v)>=1000?(v/1000)+'k':v}</text>`;
  }
  labels.forEach((lb,i)=>{
    const cx=pl+gw*i+gw/2;
    series.forEach((se,j)=>{
      const v=se.values[i]; const x=cx-(series.length*bw)/2+j*bw;
      const y0=y(0), y1=y(v);
      s+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw-1}" height="${Math.max(0.5,Math.abs(y0-y1))}" rx="2" style="--i:${i}" fill="${se.color}"><title>${esc(se.name)} ${esc(lb)}: ${chf(v)}</title></rect>`;
    });
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  s+='</svg><div class="legend">'+series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')+'</div>';
  return s;
}

  tab:'dash', key:nowKey(), scope:lsGet('budget_scope','all'), year:new Date().getFullYear(),
  yview:'year', q:'', fKat:'', fStat:'on', user:null, phase:'boot', err:'', pending:false, focusId:null, animate:false, shown:false, cu:{}, flashId:null, logN:40
};
const scopeLabel = {all:'Haushalt', NJ:'Nicola', VS:'Vanessa'};
const pick = (c,scope) => scope==='NJ'?c.N : scope==='VS'?c.V : c.H;
const itemAmt = (it,scope) => scope==='NJ'?it.n : scope==='VS'?it.v : it.n+it.v;
const WER_OPT = [['NJ','Nicola'],['VS','Vanessa'],['50/50','50 / 50']];
const ART_OPT = [['Monatlich','Monatlich'],['Einmalig','Einmalig'],['Jährlich','Jährlich'],['Lohn','Weitere Einnahme']];

/* ============ Bausteine ============ */
function scopeSeg(){
  if(!isAdmin()) return '';
  return `<div class="seg">${['all','NJ','VS'].map(s=>`<button class="${ui.scope===s?'on '+(s==='NJ'?'nj':s==='VS'?'vs':''):''}" data-scope="${s}">${scopeLabel[s]}</button>`).join('')}</div>`;
}
function monthNav(){
  return `<div class="mnav"><button data-mshift="-1" aria-label="Vorheriger Monat">‹</button>
    <div class="lab" style="line-height:38px">${label(ui.key)}<input type="month" value="${toInput(ui.key)}" data-mpick aria-label="Monat wählen"></div>
    <button data-mshift="1" aria-label="Nächster Monat">›</button></div>`;
}
function yearNav(){
  return `<div class="mnav"><button data-yshift="-1" aria-label="Vorheriges Jahr">‹</button><div class="lab" style="line-height:38px">${ui.year}</div><button data-yshift="1" aria-label="Nächstes Jahr">›</button></div>`;
}
function topbar(title,{month=false,year=false,scope=false}={}){
  return `<div class="topbar"><h1>${title}</h1>${month?monthNav():''}${year?yearNav():''}${scope?scopeSeg():''}</div>`;
}

/* ============ Dashboard ============ */
function viewDash(){
  const md=monthData(ui.key), c=calc(md), P=pick(c,ui.scope), cur=nowKey(), adm=isAdmin();
  const empty = !S.entries.length && !Object.keys(S.lohn).length;
  let h=topbar('Übersicht',{month:true,scope:true});
  if(empty && !adm) h+=`<div class="panel"><div class="ph"><h2>Willkommen</h2></div><p style="margin:0 0 8px">Noch keine Einträge. Lege mit <b>Eintrag hinzufügen</b> deine Fixkosten an und trage unter Löhne deinen Lohn ein.</p><div class="actions"><button class="btn" data-act="add">Eintrag hinzufügen</button></div></div>`;
  else if(empty) h+=`<div class="panel"><div class="ph"><h2>Willkommen</h2></div><p style="margin:0 0 8px">Noch keine Daten. Lade deine Startdaten aus dem Excel (Fixkosten, Löhne Juli bis September) oder lege mit <b>Eintrag hinzufügen</b> los.</p><div class="actions"><button class="btn" data-act="seed">Startdaten laden</button><button class="btn sec" data-act="add">Eintrag hinzufügen</button></div></div>`;
  const kp=[['ein','Einnahmen'],['mon','Monatliche Ausgaben'],['einm','Einmalige Ausgaben'],['steuer','Steuerkonto (jährlich ÷ 12)'],['spar','Sparkonto']];
  h+=`<div class="kpis">`+kp.map(([f,l])=>`<div class="kpi ${f}"><div class="kl">${l}</div><div class="kv2 ${f==='spar'&&P[f]<0?'neg':''}" data-cu="${f}|${P[f]}">${chf(P[f])}</div><div class="ks">${ui.scope==='all'&&adm?`<span class="n">N ${fmt0(c.N[f])}</span> · <span class="v">V ${fmt0(c.V[f])}</span>`:(f==='spar'&&P.ein?'Sparquote '+(P.spar/P.ein*100).toFixed(1)+' %':'&nbsp;')}</div></div>`).join('')+`</div>`;
  /* linke Spalte */
  let L='';
  const rows=[['ein','Einnahmen'],['mon','Monatliche Ausgaben'],['einm','Einmalige Ausgaben'],['steuer','Buchung ans Steuerkonto'],['spar','Buchung ins Sparkonto']];
  L+=`<div class="panel"><div class="ph"><h2>${adm?'Nicola und Vanessa':'Vanessa'}${md.frozen?'<span class="frozen">🔒 eingefroren</span>':''}</h2>${md.frozen?'<button class="btn sec sm" data-fedit="'+ui.key+'">Monat bearbeiten</button>':''}</div>
   <table class="ledger"><tr><th></th>${adm?'<th class="n">Nicola</th>':''}<th class="v">Vanessa</th>${adm?'<th>Haushalt</th>':''}</tr>`+
   rows.map(([f,l])=>`<tr class="${f==='spar'?'spar':''}"><td>${l}${f==='steuer'?'<small>Jahreskosten ÷ 12</small>':''}</td>${adm?`<td class="n ${c.N[f]<0&&f==='spar'?'neg':''}">${fmt(c.N[f])}</td>`:''}<td class="v ${c.V[f]<0&&f==='spar'?'neg':''}">${fmt(c.V[f])}</td>${adm?`<td class="h ${c.H[f]<0&&f==='spar'?'neg':''}">${fmt(c.H[f])}</td>`:''}</tr>`).join('')+
   `<tr><td style="color:var(--muted)">Sparquote</td>${adm?`<td class="n">${c.N.ein?(c.N.spar/c.N.ein*100).toFixed(1)+' %':'–'}</td>`:''}<td class="v">${c.V.ein?(c.V.spar/c.V.ein*100).toFixed(1)+' %':'–'}</td>${adm?`<td class="h">${c.H.ein?(c.H.spar/c.H.ein*100).toFixed(1)+' %':'–'}</td>`:''}</tr></table></div>`;
  const all=[...new Set([...cats(), ...Object.keys(c.cat)])];
  const vals=all.map(k=>{const o=c.cat[k]||{n:0,v:0}; const n=adm?o.n:0; return {k,n,v:o.v,t:n+o.v};}).filter(x=>x.t>0.004).sort((a,b)=>b.t-a.t);
  const mx=Math.max(1,...vals.map(x=>x.t)), tot=vals.reduce((a,x)=>a+x.t,0);
  L+=`<div class="panel bars"><div class="ph"><h2>Ausgaben nach Kategorie</h2><span class="hint" style="margin:0">inkl. Steuerkonto-Anteil</span></div>`+
   (vals.length?vals.map((x,ri)=>`<div class="row"><span>${esc(x.k)}</span><div class="track" style="--r:${ri}"><i style="width:${x.n/mx*100}%;background:var(--nic)"></i><i style="width:${x.v/mx*100}%;background:var(--van)"></i></div><span class="amt">${fmt(x.t)}</span></div>`).join('')+`<div class="row" style="font-weight:700"><span>Total</span><span></span><span class="amt">${fmt(tot)}</span></div><div class="legend">${adm?'<span><i style="background:var(--nic)"></i>Nicola</span>':''}<span><i style="background:var(--van)"></i>Vanessa</span></div>`:'<div class="empty">Keine Ausgaben in diesem Monat.</div>')+`</div>`;
  /* Zahlungen pro Person */
  const pay=who=>{
    const lines=[]; const sc=who==='NJ'?'n':'v';
    const lohn=who==='NJ'?md.lohnN:md.lohnV;
    md.items.forEach(it=>{ const a=it[sc]; if(a>0.004 && it.art!=='Lohn') lines.push({kat:it.kat,name:it.name,art:it.art,amt:a,id:it.id,betrag:it.betrag}); });
    const g={}; lines.forEach(l=>(g[l.kat]=g[l.kat]||[]).push(l));
    const out=all.filter(k=>g[k]).map(k=>`<div class="pl-cat"><span>${esc(k)}</span><span class="num">${fmt(g[k].reduce((a,l)=>a+l.amt,0))}</span></div>`+
      g[k].sort((a,b)=>b.amt-a.amt).map(l=>`<div class="pl ${md.frozen||!l.id||!canEditId(l.id)?'nolink':''}" ${md.frozen||!l.id||!canEditId(l.id)?'':`data-edit="${l.id}"`}><span class="t">${esc(l.name||'(ohne Name)')}<small>${l.art==='Jährlich'?'jährlich '+fmt0(l.betrag):l.art==='Einmalig'?'einmalig':''}</small></span><span class="num">${fmt(l.amt)}</span></div>`).join('')).join('');
    const tot=lines.reduce((a,l)=>a+l.amt,0);
    return `<div><div class="pl-head ${sc}"><span>${who==='NJ'?'Nicola':'Vanessa'} zahlt</span><span class="num">${fmt(tot)}</span></div>${out||'<div class="empty">Keine Zahlungen.</div>'}</div>`;
  };
  L+=`<div class="panel"><div class="ph"><h2>Wer zahlt was in ${MONTHS[ymOf(ui.key).m-1]}</h2><span class="hint" style="margin:0">Zeile antippen zum Bearbeiten</span></div><div class="${adm?'two':''}">${adm?pay('NJ'):''}${pay('VS')}</div></div>`;
  /* rechte Spalte */
  let R='';
  const yr=yearData(ui.year);
  R+=`<div class="panel"><div class="ph"><h2>Jahr ${ui.year}</h2><span class="hint" style="margin:0">${scopeLabel[ui.scope]}</span></div>${chart(yr.map(r=>MONTHS[r.m-1].slice(0,3)),[
    {name:'Einnahmen',color:'#e0b72f',values:yr.map(r=>pick(r.c,ui.scope).ein)},
    {name:'Ausgaben',color:'#79b35b',values:yr.map(r=>{const p=pick(r.c,ui.scope);return p.mon+p.einm;})},
    {name:'Sparkonto',color:'#2563c9',values:yr.map(r=>pick(r.c,ui.scope).spar)}])}</div>`;
  const expired=S.entries.filter(e=>status(e,cur)==='past'&&canEdit(e));
  const ending=S.entries.filter(e=>e.art!=='Einmalig'&&e.bis!=null&&e.bis>=ui.key&&e.bis<=ui.key+1&&isActive(e,ui.key));
  const incompl=S.entries.filter(e=>!e.name||!(e.betrag>0));
  const hl=[];
  if(expired.length) hl.push(`<div class="hl"><span class="ic">🧹</span><div><b>${expired.length} abgelaufene Einträge</b><div class="hint" style="margin:0">Vergangene Monate sind eingefroren, du kannst sie löschen.</div><div class="actions" style="margin-top:6px"><button class="btn sec sm" data-act="cleanup">Aufräumen</button></div></div></div>`);
  if(ending.length) hl.push(`<div class="hl"><span class="ic">⏳</span><div><b>Endet bald</b><div class="hint" style="margin:0">${ending.map(e=>esc(e.name)+' ('+short(e.bis)+')').join(', ')}</div></div></div>`);
  if(incompl.length) hl.push(`<div class="hl"><span class="ic">⚠️</span><div><b>${incompl.length} unvollständige Einträge</b><div class="hint" style="margin:0">Ohne Name oder Betrag, siehe Einträge.</div></div></div>`);
  const lastFrozen=Object.keys(S.frozen).map(Number).sort((a,b)=>b-a)[0];
  hl.push(`<div class="hl"><span class="ic">🔒</span><div><b>${lastFrozen?'Eingefroren bis '+label(lastFrozen):'Noch nichts eingefroren'}</b><div class="hint" style="margin:0">Vergangene Monate ändern sich nicht mehr, wenn du Einträge änderst oder löschst.</div></div></div>`);
  R+=`<div class="panel"><div class="ph"><h2>Hinweise</h2></div>${hl.join('')}</div>`;
  R+=`<div class="panel"><div class="ph"><h2>Schnell erfassen</h2></div><div class="actions" style="margin-top:0"><button class="btn" data-act="add">Eintrag hinzufügen</button><button class="btn sec" data-tab="entries">Alle Einträge</button><button class="btn sec" data-act="export-open">Export</button></div></div>`;
  return h+`<div class="dgrid"><div>${L}</div><div>${R}</div></div>`;
}

/* ============ Einträge (direkt bearbeitbar) ============ */
const canEditId = id => { const e=S.entries.find(x=>x.id===id); return !e || canEdit(e); };
const isMobile=()=>window.matchMedia('(max-width:899px)').matches;
try{ window.matchMedia('(max-width:899px)').addEventListener('change',()=>{ if(ui.phase==='app') render(); }); }catch{}
function mrow(e){
  const st=status(e,ui.key), range=e.art==='Einmalig'?short(e.ab):short(e.ab)+' – '+(e.bis==null?'offen':short(e.bis));
  const ce=canEdit(e);
  return `<div class="mrow ${st==='on'?'':'off'}" ${ce?`data-edit="${e.id}"`:'style="cursor:default"'}><div class="m"><div class="t">${esc(e.name||'(ohne Name)')}</div><div class="s"><b style="color:${e.wer==='NJ'?'var(--nic)':e.wer==='VS'?'var(--van)':'var(--muted)'}">${e.wer==='NJ'?'Nicola':e.wer==='VS'?'Vanessa':'50/50'}</b>${ce?'':' 🔒'} · ${e.art==='Lohn'?'Einnahme':e.art} · ${range}${st==='past'?' · abgelaufen':st==='future'?' · geplant':''}</div></div><div class="a num">${fmt(e.betrag)}${e.art==='Jährlich'?`<small>${fmt(monthlyAmount(e))} / Monat</small>`:''}</div></div>`;
}
function erow(e){
  const st=status(e,ui.key), m=monthlyAmount(e), s=shares(e.wer), on=st==='on', ce=canEdit(e), adm=isAdmin(), dis=ce?'':'disabled';
  const opt=(list,v)=>list.map(([val,l])=>`<option value="${esc(val)}" ${v===val?'selected':''}>${l}</option>`).join('');
  return `<div class="erow ${st}" data-eid="${e.id}" data-art="${e.art}">
   <div class="c name"><span class="lb">Beschreibung</span><input data-f="name" value="${esc(e.name)}" placeholder="Beschreibung" autocomplete="off" ${dis}></div>
   <div class="c art"><span class="lb">Art</span><select data-f="art" ${dis}>${opt(ART_OPT,e.art)}</select></div>
   <div class="c bet"><span class="lb">${e.art==='Jährlich'?'Jahresbetrag':'Betrag'}</span><input class="num" data-f="betrag" type="number" step="0.05" inputmode="decimal" value="${e.betrag}" style="text-align:right" ${dis}></div>
   <div class="c wer who-${e.wer==='50/50'?'b':e.wer}"><span class="lb">Wer zahlt</span><select data-f="wer" ${dis}>${opt(WER_OPT,e.wer)}</select></div>
   <div class="c ab"><span class="lb">${e.art==='Einmalig'?'Monat':'Ab'}</span><input data-f="ab" type="month" value="${toInput(e.ab)}" ${dis}></div>
   <div class="c bis"><span class="lb">Bis</span><input data-f="bis" type="month" value="${toInput(e.bis)}" ${e.art==='Einmalig'||!ce?'disabled':''}></div>
   ${adm?`<div class="c an num ${on?'':'dim'}"><span class="lb">Nicola</span>${on&&s.n?fmt(m*s.n):'–'}</div>`:'<div class="c an"></div>'}
   <div class="c av num ${on?'':'dim'}"><span class="lb">Vanessa</span>${on&&s.v?fmt(m*s.v):'–'}</div>
   <div class="c act">${ce?`<button class="ib" data-edit="${e.id}" title="Details, Kategorie, Betrag ab Monat ändern">✎</button><button class="ib" data-delrow="${e.id}" title="Löschen">🗑</button>`:'<span title="Gemeinsamer Eintrag, nur Nicola kann ihn ändern">🔒</span>'}</div></div>`;
}
function viewEntries(){
  const k=ui.key, q=ui.q.trim().toLowerCase();
  let list=S.entries.slice();
  if(q) list=list.filter(e=>(e.name||'').toLowerCase().includes(q)||(e.kat||'').toLowerCase().includes(q));
  if(ui.fKat) list=list.filter(e=>(e.art==='Lohn'?'Lohn':e.kat)===ui.fKat);
  if(ui.fStat!=='all') list=list.filter(e=>status(e,k)===ui.fStat);
  if(ui.scope!=='all') list=list.filter(e=>{const s=shares(e.wer); return (ui.scope==='NJ'?s.n:s.v)>0;});
  const groups={}; list.forEach(e=>{const g=e.art==='Lohn'?'Lohn':e.kat; (groups[g]=groups[g]||[]).push(e);});
  const order=[...cats(),'Lohn']; Object.keys(groups).forEach(g=>{ if(!order.includes(g)) order.push(g); });
  let h=topbar('Einträge',{month:true,scope:true});
  h+=`<div class="fbar"><input type="search" data-q placeholder="Suchen …" value="${esc(ui.q)}">
   <select data-fkat><option value="">Alle Kategorien</option>${[...cats(),'Lohn'].map(c=>`<option value="${esc(c)}" ${ui.fKat===c?'selected':''}>${c==='Lohn'?'Weitere Einnahmen':esc(c)}</option>`).join('')}</select>
   <select data-fstat>${[['on','Gültig im '+MONTHS[ymOf(k).m-1]],['all','Alle'],['past','Abgelaufen'],['future','Geplant']].map(([v,l])=>`<option value="${v}" ${ui.fStat===v?'selected':''}>${l}</option>`).join('')}</select>
   <span style="flex:1"></span><button class="btn" data-act="add">Eintrag hinzufügen</button></div>`;
  const names=order.filter(g=>groups[g]||(!q&&!ui.fKat&&ui.fStat==='on'&&g!=='Lohn'));
  names.forEach(g=>{
    const arr=groups[g]||[];
    const sum=arr.filter(e=>isActive(e,k)).reduce((a,e)=>{const s=shares(e.wer),m=monthlyAmount(e); return a+m*(ui.scope==='NJ'?s.n:ui.scope==='VS'?s.v:1);},0);
    h+=`<div class="egroup"><div class="eg-h"><span>${g==='Lohn'?'Weitere Einnahmen':esc(g)}</span><span><span class="sum num">${arr.length?fmt(sum)+' / Monat':''}</span><button class="btn sec sm" data-addin="${esc(g)}">＋ Zeile</button></span></div>`;
    if(arr.length){
      if(isMobile()) h+=arr.sort((a,b)=>b.betrag-a.betrag).map(mrow).join(''); else {
      h+=`<div class="ehead"><span>Beschreibung</span><span>Art</span><span class="r">Betrag</span><span>Wer zahlt</span><span>Ab</span><span>Bis</span>${isAdmin()?'<span class="r">Nicola</span>':'<span></span>'}<span class="r">Vanessa</span><span></span></div>`;
      h+=arr.sort((a,b)=>(a.name||'').localeCompare(b.name||'','de')).map(erow).join(''); }
    } else h+=`<div class="empty" style="padding:12px">Keine Einträge in diesem Filter.</div>`;
    h+=`</div>`;
  });
  if(!names.length) h+=`<div class="panel"><div class="empty">Keine Einträge gefunden.</div></div>`;
  h+=`<div class="hint">${!isAdmin()?'Du kannst deine eigenen Einträge ändern. Gemeinsame Einträge (50 / 50, 🔒) verwaltet Nicola.<br>':''}${isMobile()?'Eintrag antippen zum Bearbeiten.':'Änderungen werden beim Verlassen des Feldes gespeichert. «Betrag ab Monat ändern» und «Beenden» findest du unter ✎.'}</div>`;
  return h;
}

/* ============ Admin / Verwaltung ============ */
function installPanel(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let body;
  if(standalone) body='<div class="hint" style="margin:0">✓ Läuft als installierte App.</div>';
  else if(ui.installEvt) body='<div class="actions" style="margin-top:0"><button class="btn sm" data-act="install">App installieren</button></div>';
  else if(ios) body='<div class="hint" style="margin:0;line-height:1.6">iPhone / iPad: In Safari unten auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>.</div>';
  else body='<div class="hint" style="margin:0;line-height:1.6">Android / Chrome: Menü (⋮) → <b>App installieren</b> bzw. «Zum Startbildschirm». Dafür muss die Seite über https gehostet sein (siehe Anleitung).</div>';
  return `<div class="panel"><div class="ph"><h2>Als App installieren</h2></div>${body}</div>`;
}
function logPanel(){
  const log=S.log.slice(0,ui.logN);
  const fmtT=t=>{const d=new Date(t); return d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});};
  return `<div class="panel"><div class="ph"><h2>Änderungsprotokoll</h2><span class="hint" style="margin:0">${S.log.length} Einträge</span></div>
   ${log.length?log.map(l=>`<div class="logrow"><span class="lt">${fmtT(l.at)}</span><span class="lw ${l.role==='Vanessa'?'v':'n'}">${esc(l.role||'')}</span><span class="la">${esc(l.action)}</span><span class="lx">${esc(l.text)}</span></div>`).join(''):'<div class="empty">Noch keine Änderungen protokolliert.</div>'}
   ${S.log.length>ui.logN?'<div class="actions"><button class="btn sec sm" data-act="logmore">Mehr anzeigen</button></div>':''}</div>`;
}
function viewAdmin(){
  const adm=isAdmin();
  const frozenKeys=Object.keys(S.frozen).map(Number).sort((a,b)=>b-a);
  const unlocked=(S.settings.unlocked||[]).slice().sort((a,b)=>b-a);
  const user=backend&&backend.user, fb=backend&&backend.mode==='firebase';
  let h=topbar(adm?'Verwaltung':'Mehr');
  const conn=`<div class="panel"><div class="ph"><h2>Verbindung</h2></div>
   <p style="margin:0 0 8px">${fb?`☁ Firebase · angemeldet als <b>${esc(user&&user.email||'')}</b>${adm?'':' (nur eigene Daten)'}`:`💾 Lokaler Modus – Daten nur in diesem Browser${adm?'':' · Testansicht Vanessa'}`}</p>
   <div class="actions">${fb?'<button class="btn sec sm" data-act="logout">Abmelden</button>':''}${adm?(!fb?'<button class="btn sm" data-act="to-firebase">Mit Firebase verbinden</button>':'<button class="btn sec sm" data-act="to-local">Lokal testen</button>')+'<button class="btn sec sm" data-act="reset-config">Firebase-Konfiguration ändern</button>':''}
   ${!fb?`<button class="btn sec sm" data-act="toggle-role">${adm?'Testansicht: Vanessa':'Zurück zur Admin-Ansicht'}</button>`:''}</div></div>`;
  const exp=`<div class="panel"><div class="ph"><h2>Export</h2></div><div class="hint" style="margin:0 0 8px">Monat oder Jahr als Excel-Tabelle (CSV) oder PDF, z. B. für die Steuererklärung.</div><div class="actions" style="margin-top:0"><button class="btn sm" data-act="export-open">Exportieren …</button></div></div>`;
  if(!adm) return h+`<div class="two"><div>${conn}${exp}</div><div>${installPanel()}<div class="panel"><div class="ph"><h2>Dein Zugang</h2></div><div class="hint" style="line-height:1.6">Du siehst und bearbeitest deine eigenen Kosten und deinen Lohn. Gemeinsame Kosten (50 / 50) siehst du mit deinem Anteil, Nicola verwaltet sie. Vergangene Monate sind gesperrt.</div></div></div></div>`;
  h+=`<div class="two"><div>${conn}
  <div class="panel"><div class="ph"><h2>Zugriff</h2></div><div class="hint" style="line-height:1.6">Du bist Admin und siehst alles. <b>Vanessa</b> hat einen eigenen Zugang: Sie sieht nur ihre Einträge, ihren Anteil an 50/50-Kosten und ihren Lohn, nichts von dir. Das wird in den Firestore-Regeln erzwungen (Firebase → Firestore → Regeln, siehe Anleitung). Ihre Google-E-Mail steht dort bei <code>vanessa()</code>.</div></div>
  ${exp}${installPanel()}
  <div class="panel"><div class="ph"><h2>Kategorien</h2></div>

/* ============ Eingefrorenen Monat bearbeiten ============ */
function openFrozen(k){
  const base=S.frozen[k]||{items:liveItems(k),lohnN:lohnBase(k).n,lohnV:lohnBase(k).v};
  const fr=JSON.parse(JSON.stringify({items:base.items,lohnN:base.lohnN||0,lohnV:base.lohnV||0}));
  const m=$('#modal'); const allc=[...cats()];
  const draw=()=>{
    m.innerHTML=`<div class="sheet wide"><h3>${label(k)} bearbeiten <span class="frozen">🔒 eingefroren</span></h3>
    <div class="hint">Änderungen gelten nur für diesen Monat. Die laufenden Einträge bleiben unverändert.</div>
    <div class="two-c"><label class="f">Lohn Nicola<input type="number" step="0.05" data-fl="lohnN" value="${fr.lohnN}"></label><label class="f">Lohn Vanessa<input type="number" step="0.05" data-fl="lohnV" value="${fr.lohnV}"></label></div>
    <div>${fr.items.map((it,i)=>`<div class="frow" data-i="${i}">
      <input data-ff="name" value="${esc(it.name)}" placeholder="Beschreibung">
      <select data-ff="kat">${[...new Set([...allc,it.kat])].map(c=>`<option ${it.kat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select data-ff="art">${ART_OPT.map(([v,l])=>`<option value="${v}" ${it.art===v?'selected':''}>${l}</option>`).join('')}</select>
      <input data-ff="betrag" type="number" step="0.05" value="${it.betrag}" style="text-align:right">
      <select data-ff="wer">${WER_OPT.map(([v,l])=>`<option value="${v}" ${it.wer===v?'selected':''}>${l}</option>`).join('')}</select>
      <button class="ib" type="button" data-fdel="${i}">🗑</button></div>`).join('')}</div>
    <div class="actions"><button class="btn sec sm" type="button" data-fadd>＋ Zeile</button></div>
    <div class="actions" style="margin-top:14px"><button class="btn grow" type="button" data-fsave>Speichern</button><button class="btn sec" type="button" data-close>Abbrechen</button></div>
    <div class="actions" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><button class="btn sec sm" type="button" data-funlock>Entsperren (wieder live berechnen)</button></div></div>`;
    m.classList.add('on');
    const sync=()=>{
      m.querySelectorAll('[data-fl]').forEach(i=>fr[i.dataset.fl]=parseFloat(i.value)||0);
      m.querySelectorAll('.frow').forEach(r=>{const it=fr.items[+r.dataset.i]; r.querySelectorAll('[data-ff]').forEach(i=>{const f=i.dataset.ff; it[f]=f==='betrag'?(parseFloat(i.value)||0):i.value;});});
    };
    m.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>{ sync(); fr.items.splice(+b.dataset.fdel,1); draw(); });
    $('[data-fadd]',m).onclick=()=>{ sync(); fr.items.push({id:null,art:'Einmalig',kat:allc[0],name:'',betrag:0,wer:'50/50'}); draw(); };
    $('[data-close]',m).onclick=closeModal;
    $('[data-fsave]',m).onclick=async()=>{
      sync();
      const items=fr.items.map(it=>{ const mm=it.art==='Jährlich'?it.betrag/12:it.betrag, s=shares(it.wer); return {id:it.id||null,art:it.art,kat:it.art==='Lohn'?'Lohn':it.kat,name:it.name,betrag:it.betrag,wer:it.wer,n:mm*s.n,v:mm*s.v}; });
      await backend.batch(freezeOps(k,{key:k,items,lohnN:fr.lohnN,lohnV:fr.lohnV,at:Date.now()}));
      logEv('Monat bearbeitet',label(k)+' (eingefroren) von Hand angepasst');
      closeModal(); toast('Monat gespeichert');
    };
    $('[data-funlock]',m).onclick=async()=>{
      if(!confirm('Monat entsperren? Er wird dann wieder aus den laufenden Einträgen berechnet.')) return;
      await backend.set('settings','main',{...S.settings,unlocked:[...new Set([...(S.settings.unlocked||[]),k])]});
      await backend.batch([{col:'frozen',id:String(k),del:true},{col:'frozenV',id:String(k),del:true}]); logEv('Entsperrt',label(k)); closeModal(); toast('Entsperrt');
    };
  };
  draw();
}

    <main class="main">${body}</main></div>`;
  if(ui.focusId){ const el=$(`[data-eid="${ui.focusId}"] [data-f=name]`); if(el){ el.focus(); el.scrollIntoView({block:'center'}); } ui.focusId=null; }
  else if(ui.keepScroll){ window.scrollTo(0,sy); }
  ui.keepScroll=false;
  if(ui.phase==='app' && !ui.shown){ ui.shown=true; ui.animate=true; }
  app.classList.toggle('anim',!!ui.animate);
  clearTimeout(ui.at); if(ui.animate) ui.at=setTimeout(()=>app.classList.remove('anim'),1100);
  runCountUp(ui.animate); ui.animate=false;
  if(ui.flashId){ const r=$(`[data-eid="${ui.flashId}"]`); if(r) r.classList.add('flash'); ui.flashId=null; }
}
function runCountUp(animate){
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-cu]').forEach(el=>{
    const [k,vs]=el.dataset.cu.split('|'); const v=parseFloat(vs); const prev=ui.cu[k]; ui.cu[k]=v;
    if(!animate||reduced) return;
    const from=prev==null?0:prev; if(from===v) return;
    const t0=performance.now(), dur=600;
    const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=chf(from+(v-from)*e); if(p<1) requestAnimationFrame(step); else el.textContent=chf(v); };
    requestAnimationFrame(step);
  });
}

async function saveEntryField(row,f,val){
  const e=S.entries.find(x=>x.id===row.dataset.eid); if(!e) return;
  const o={...e}; delete o.id;
  if(f==='betrag') o.betrag=parseFloat(val)||0;
  else if(f==='ab'){ const k=fromInput(val); if(k==null){ toast('Monat fehlt'); render(); return; } o.ab=k; }
  else if(f==='bis') o.bis=fromInput(val);
  else o[f]=val;
  if(o.art==='Einmalig') o.bis=null;
  if(o.art==='Lohn') o.kat='Lohn'; else if(o.kat==='Lohn') o.kat=cats()[0];
  if(o.bis!=null && o.bis<o.ab){ toast('«Bis» liegt vor «Ab»'); render(); return; }
  if(!canEdit(e)) return;
  if(!isAdmin()) o.wer='VS';
  await autoFreeze();
  ui.flashId=e.id;
  await backend.set('entries',e.id,o);
  logEv('Geändert',diffText(e,o));
}
document.addEventListener('click', async ev=>{
  const t=ev.target.closest('[data-tab],[data-scope],[data-mshift],[data-yshift],[data-yview],[data-edit],[data-act],[data-refreeze],[data-delcat],[data-delrow],[data-addin],[data-fedit],[data-relock]');
  if(!t) return;
  const d=t.dataset;
  if(d.tab){ ui.tab=d.tab; ui.animate=true; render(); window.scrollTo(0,0); }
  else if(d.scope){ ui.scope=d.scope; lsSet('budget_scope',d.scope); ui.animate=true; ui.keepScroll=true; render(); }
  else if(d.mshift){ ui.key+=+d.mshift; ui.year=ymOf(ui.key).y; ui.animate=true; ui.keepScroll=true; render(); }
  else if(d.yshift){ ui.year+=+d.yshift; ui.animate=true; ui.keepScroll=true; render(); }
  else if(d.yview){ ui.yview=d.yview; ui.animate=true; ui.keepScroll=true; render(); }
  else if(d.edit){ openEntry(d.edit); }
  else if(d.fedit){ openFrozen(+d.fedit); }
  else if(d.refreeze){ await refreezeMonth(+d.refreeze); }
  else if(d.relock){ const k=+d.relock; await backend.set('settings','main',{...S.settings,unlocked:(S.settings.unlocked||[]).filter(x=>x!==k)}); await refreezeMonth(k); logEv('Gesperrt',label(k)); }
  else if(d.delcat){ await backend.set('settings','main',{...S.settings,kats:cats().filter(c=>c!==d.delcat)}); logEv('Kategorie',d.delcat+' entfernt'); }
  else if(d.delrow){
    const e=S.entries.find(x=>x.id===d.delrow); if(!e) return;
    if(!confirm(`«${e.name||'Eintrag'}» wirklich löschen?\nVergangene (eingefrorene) Monate bleiben unverändert.`)) return;
    await autoFreeze(); await backend.del('entries',e.id); logEv('Gelöscht',entryDesc(e)); toast('Gelöscht');
  }
  else if(d.addin!==undefined){
    const g=d.addin; const id=uid();
    const obj={art:g==='Lohn'?'Lohn':'Monatlich',kat:g==='Lohn'?'Lohn':g,name:'',betrag:0,wer:isAdmin()?'50/50':'VS',ab:ui.key,bis:null};
    ui.focusId=id; ui.fStat='on'; await backend.set('entries',id,obj); logEv('Neu','Leere Zeile in «'+g+'» angelegt');
  }
  else if(d.act){
    const a=d.act;
    if(a==='add') openEntry(null);
    else if(a==='seed') await seedData();
    else if(a==='logmore'){ ui.logN+=60; ui.keepScroll=true; render(); }
    else if(a==='export-open') openExport();
    else if(a==='install'){ const ev=ui.installEvt; if(ev){ ev.prompt(); await ev.userChoice.catch(()=>{}); ui.installEvt=null; render(); } }
    else if(a==='toggle-role'){ lsSet('budget_role', isAdmin()?'v':'admin'); location.reload(); }
    else if(a==='export') exportData();
    else if(a==='cleanup'){
      const exp=S.entries.filter(e=>status(e,nowKey())==='past'&&canEdit(e));
      if(!exp.length) return;
      if(!confirm(`${exp.length} abgelaufene Einträge löschen?\nVergangene Monate sind eingefroren und bleiben unverändert.`)) return;
      await autoFreeze(); await backend.batch(exp.map(e=>({col:'entries',id:e.id,del:true}))); logEv('Aufgeräumt',exp.length+' abgelaufene Einträge gelöscht: '+exp.map(e=>e.name).join(', ')); toast(exp.length+' gelöscht');
    }
    else if(a==='login'){ try{ ui.err=''; await backend.signIn(); }catch(e){ ui.err='Anmeldung fehlgeschlagen: '+(e.code||e.message); render(); } }
    else if(a==='logout'){ await backend.signOut(); ui.phase='login'; ready=false; render(); }
    else if(a==='to-local'){ lsSet('budget_mode','local'); location.reload(); }
    else if(a==='to-firebase'){ lsDel('budget_mode'); location.reload(); }
    else if(a==='reset-config'){ lsDel('budget_fbconfig'); lsDel('budget_mode'); ui.phase='setup'; ui.err=''; render(); }
    else if(a==='save-config'){
      const txt=$('#cfgtxt').value; const cfg={...FIREBASE_CONFIG};
      for(const m of txt.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g)) cfg[m[1]]=m[2];
      if(!cfg.apiKey||!cfg.projectId){ ui.err='apiKey und projectId fehlen im eingefügten Text.'; render(); return; }
      if(!cfg.authDomain) cfg.authDomain=cfg.projectId+'.firebaseapp.com';
      lsSet('budget_fbconfig',JSON.stringify(cfg)); lsDel('budget_mode'); location.reload();
    }
  }
});

function viewLohn(){
  const f=firstKey(), cur=nowKey(), adm=isAdmin();
  const start=Math.min(f==null?cur:f, cur-1), end=cur+12;
  let h=`<div class="panel"><h2>Löhne pro Monat</h2><div class="hint">Nur den tatsächlichen Lohn des Monats eintragen. Leer = gleicher Lohn wie im Vormonat (grau angezeigt). Alte Monate bleiben stehen – nichts löschen.${adm?'':' Eingefrorene Monate (🔒) sind gesperrt.'}</div>
  <div class="lohn-head ${adm?'':'one'}"><span>Monat</span>${adm?'<span>Nicola</span>':''}<span>Vanessa</span></div>`;
  for(let k=start;k<=end;k++){
    const o=S.lohn[k]||{}, b=lohnBase(k), lock=!adm&&S.frozen[k]?'disabled':'';
    h+=`<div class="lohn-row ${adm?'':'one'} ${k===ui.key?'cur':''}"><span class="mo">${label(k)}${S.frozen[k]?' 🔒':''}</span>

      <input type="number" step="0.05" inputmode="decimal" data-lohn="${k}" data-p="v" value="${o.v??''}" placeholder="${fmt(b.v)}" ${lock}></div>`;
  }
  return h+`</div>`;
}

    h+=`<div class="panel"><h2>Jahresübersicht ${ui.year} · ${scopeLabel[sc]}</h2><div class="scroll"><table class="t"><tr><th>Monat</th><th>Einn.</th><th>Ausg.</th><th>Steuerk.</th><th>Spar</th></tr>`+
      rows.map(r=>{const P=pick(r.c,sc); return `<tr class="${r.k===ui.key?'cur':r.k>cur?'fut':''}"><td>${MONTHS[r.m-1].slice(0,3)}${r.frozen?' 🔒':''}</td><td>${fmt0(P.ein)}</td><td>${fmt0(ausg(r))}</td><td>${fmt0(P.steuer)}</td><td class="${P.spar<0?'neg':''}">${fmt0(P.spar)}</td></tr>`;}).join('')+
      `<tr class="tot"><td>Total</td><td>${fmt0(sumField(rows,sc,'ein'))}</td><td>${fmt0(rows.reduce((a,r)=>a+ausg(r),0))}</td><td>${fmt0(sumField(rows,sc,'steuer'))}</td><td>${fmt0(sumField(rows,sc,'spar'))}</td></tr></table></div>
      <div class="hint">🔒 = eingefroren · grau = geplant (aus den laufenden Einträgen hochgerechnet)</div></div>
      <div class="panel"><h2>Verlauf</h2>${chart(rows.map(r=>MONTHS[r.m-1].slice(0,3)),[
        {name:'Einnahmen',color:'#FFC000',values:rows.map(r=>pick(r.c,sc).ein)},
        {name:'Ausgaben',color:'#70AD47',values:rows.map(ausg)},
        {name:'Sparkonto',color:'#2E75B6',values:rows.map(r=>pick(r.c,sc).spar)}])}</div>`;
    const all=[...new Set([...cats(),...rows.flatMap(r=>Object.keys(r.c.cat))])];
    const ct=all.map(k=>{let n=0,v=0; rows.forEach(r=>{const o=r.c.cat[k]; if(o){n+=o.n;v+=o.v;}}); return {k,n,v};}).filter(x=>x.n+x.v>0.004);
    h+=`<div class="panel"><h2>Ausgaben nach Kategorie (inkl. Steuerkonto-Anteil)</h2><div class="scroll"><table class="t"><tr><th>Kategorie</th>${isAdmin()?'<th>Nicola</th>':''}<th>Vanessa</th>${isAdmin()?'<th>Total</th>':''}</tr>`+
      ct.map(x=>`<tr><td>${esc(x.k)}</td>${isAdmin()?`<td>${fmt0(x.n)}</td>`:''}<td>${fmt0(x.v)}</td>${isAdmin()?`<td>${fmt0(x.n+x.v)}</td>`:''}</tr>`).join('')+
      `<tr class="tot"><td>Total</td>${isAdmin()?`<td>${fmt0(ct.reduce((a,x)=>a+x.n,0))}</td>`:''}<td>${fmt0(ct.reduce((a,x)=>a+x.v,0))}</td>${isAdmin()?`<td>${fmt0(ct.reduce((a,x)=>a+x.n+x.v,0))}</td>`:''}</tr></table></div></div>`;
  } else {
    const ys=[ui.year-1,ui.year,ui.year+1,ui.year+2,ui.year+3];
    const data=ys.map(y=>({y,rows:yearData(y)}));
    const line=(lab,fn,cls='')=>`<tr class="${cls}"><td>${lab}</td>${data.map(d=>`<td>${fn(d.rows)}</td>`).join('')}</tr>`;
    h+=`<div class="panel"><h2>Jahresvergleich · ${scopeLabel[sc]}</h2><div class="scroll"><table class="t"><tr><th></th>${ys.map(y=>`<th>${y}</th>`).join('')}</tr>`+
      line('Einnahmen',r=>fmt0(sumField(r,sc,'ein')))+
      line('Monatl. + einm. Ausgaben',r=>fmt0(sumField(r,sc,'mon')+sumField(r,sc,'einm')))+
      line('Steuerkonto',r=>fmt0(sumField(r,sc,'steuer')))+
      line('Sparkonto',r=>fmt0(sumField(r,sc,'spar')),'tot')+
      line('Sparquote',r=>{const e=sumField(r,sc,'ein'); return e?(sumField(r,sc,'spar')/e*100).toFixed(1)+' %':'–';})+`</table></div>
      <div class="hint">Zukünftige Jahre sind Hochrechnungen aus den laufenden Einträgen.</div></div>
      <div class="panel"><h2>Vergleich</h2>${chart(ys.map(String),[
        {name:'Einnahmen',color:'#FFC000',values:data.map(d=>sumField(d.rows,sc,'ein'))},
        {name:'Ausgaben',color:'#70AD47',values:data.map(d=>sumField(d.rows,sc,'mon')+sumField(d.rows,sc,'einm')+sumField(d.rows,sc,'steuer'))},
        {name:'Sparkonto',color:'#2E75B6',values:data.map(d=>sumField(d.rows,sc,'spar'))}])}</div>`;
  }
  return h;
}


/* ============ Eintrag bearbeiten ============ */
function openEntry(id){
  const isNew=!id;
  const e=isNew?{art:'Monatlich',kat:cats()[0],name:'',betrag:'',wer:isAdmin()?'50/50':'VS',ab:ui.key,bis:null}:{...S.entries.find(x=>x.id===id)};
  const m=$('#modal');
  const form=()=>`<div class="sheet"><h3>${isNew?'Neuer Eintrag':'Eintrag bearbeiten'}</h3>
  <form id="ef">
    <div class="two-c"><label class="f">Art<select name="art">${['Monatlich','Einmalig','Jährlich','Lohn'].map(a=>`<option value="${a}" ${e.art===a?'selected':''}>${a==='Lohn'?'Weitere Einnahme':a}</option>`).join('')}</select></label>
    <label class="f" data-katwrap>Kategorie<select name="kat">${[...new Set([...cats(),e.kat].filter(Boolean))].map(c=>`<option ${e.kat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
    <label class="f">Beschreibung<input name="name" value="${esc(e.name)}" placeholder="z. B. Netflix" autocomplete="off"></label>
    <div class="two-c"><label class="f"><span data-betrag>Betrag (CHF)</span><input name="betrag" type="number" step="0.05" inputmode="decimal" value="${e.betrag}" required></label>
    <label class="f">Wer zahlt<select name="wer">${(isAdmin()?[['NJ','Nicola'],['VS','Vanessa'],['50/50','50 / 50']]:[['VS','Vanessa']]).map(([v,l])=>`<option value="${v}" ${e.wer===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <div class="two-c"><label class="f"><span data-ablab>Ab Monat</span><input name="ab" type="month" value="${toInput(e.ab)}" required></label>
    <label class="f" data-biswrap>Bis Monat (leer = läuft weiter)<input name="bis" type="month" value="${toInput(e.bis)}"></label></div>
    <div class="hint" data-hint></div><div class="err" data-err></div>
    <div class="actions"><button class="btn grow" type="submit">Speichern</button><button class="btn sec" type="button" data-close>Abbrechen</button></div>
    ${isNew?'':`<div class="actions" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      ${e.art!=='Einmalig'?`<button class="btn sec sm" type="button" data-end>Ab ${label(ui.key)} beenden</button><button class="btn sec sm" type="button" data-newamt>Betrag ab ${label(ui.key)} ändern</button>`:''}
      <button class="btn danger sm" type="button" data-del>Löschen</button></div>`}
  </form></div>`;
  m.innerHTML=form(); m.classList.add('on');
  const f=$('#ef');
  const sync=()=>{
    const art=f.art.value;
    $('[data-katwrap]',f).style.display=art==='Lohn'?'none':'';
    $('[data-biswrap]',f).style.display=art==='Einmalig'?'none':'';
    $('[data-ablab]',f).textContent=art==='Einmalig'?'Monat':'Ab Monat';
    $('[data-betrag]',f).textContent=art==='Jährlich'?'Jahresbetrag (CHF)':'Betrag (CHF)';
    const ab=fromInput(f.ab.value);
    $('[data-hint]',f).textContent = art==='Jährlich'&&f.betrag.value?`= ${chf(f.betrag.value/12)} pro Monat ans Steuerkonto`: (ab&&ab<nowKey()?'Vergangene Monate sind eingefroren und ändern sich nicht.':'');
  };
  f.addEventListener('input',sync); f.addEventListener('change',sync); sync();
  $('[data-close]',f).onclick=closeModal;
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const betrag=parseFloat(f.betrag.value), ab=fromInput(f.ab.value); let bis=f.art.value==='Einmalig'?null:fromInput(f.bis.value);
    const err=$('[data-err]',f);
    if(!(betrag>=0)){ err.textContent='Bitte einen Betrag eingeben.'; return; }
    if(ab==null){ err.textContent='Bitte einen Monat wählen.'; return; }
    if(bis!=null && bis<ab){ err.textContent='«Bis Monat» liegt vor «Ab Monat».'; return; }
    const obj={art:f.art.value, kat:f.art.value==='Lohn'?'Lohn':f.kat.value, name:f.name.value.trim(), betrag, wer:f.wer.value, ab, bis};
    if(!isAdmin()) obj.wer='VS';
    await autoFreeze();
    await backend.set('entries', e.id||uid(), obj);
    logEv(isNew?'Neu':'Geändert', isNew?entryDesc(obj):diffText(e,obj));
    closeModal(); toast('Gespeichert');
  };
  if(!isNew){
    $('[data-del]',f).onclick=async()=>{ if(!confirm(`«${e.name||'Eintrag'}» wirklich löschen?\nVergangene (eingefrorene) Monate bleiben unverändert.`)) return; await autoFreeze(); await backend.del('entries',e.id); logEv('Gelöscht',entryDesc(e)); closeModal(); toast('Gelöscht'); };
    const end=$('[data-end]',f); if(end) end.onclick=async()=>{
      if(e.ab>=ui.key){ if(!confirm('Der Eintrag beginnt erst in diesem Monat oder später. Ganz löschen?')) return; await autoFreeze(); await backend.del('entries',e.id); logEv('Gelöscht',entryDesc(e)); }
      else { await autoFreeze(); const o={...e}; delete o.id; o.bis=ui.key-1; await backend.set('entries',e.id,o); logEv('Beendet',`«${e.name}» endet nach ${label(ui.key-1)}`); }
      closeModal(); toast('Beendet');
    };
    const na=$('[data-newamt]',f); if(na) na.onclick=async()=>{
      const v=prompt(`Neuer Betrag ab ${label(ui.key)} (bisher ${fmt(e.betrag)}):`); if(v==null) return;
      const nb=parseFloat(String(v).replace(',','.').replace(/[’' ]/g,'')); if(!(nb>=0)){ toast('Ungültiger Betrag'); return; }
      if(e.ab>=ui.key){ const o={...e,betrag:nb}; delete o.id; await autoFreeze(); await backend.set('entries',e.id,o); logEv('Betrag',`«${e.name}»: ${fmt(e.betrag)} → ${fmt(nb)} (gleich ab Start)`); }
      else { await autoFreeze(); const oldO={...e}; delete oldO.id; oldO.bis=ui.key-1; const newO={...oldO,betrag:nb,ab:ui.key,bis:e.bis}; await backend.batch([{col:'entries',id:e.id,obj:oldO},{col:'entries',id:uid(),obj:newO}]); logEv('Betrag',`«${e.name}»: ${fmt(e.betrag)} → ${fmt(nb)} ab ${label(ui.key)}`); }
      closeModal(); toast('Betrag geändert');
    };
  }
}
function closeModal(){ const m=$('#modal'); m.classList.remove('on'); m.innerHTML=''; }

/* ============ Aktionen ============ */
async function seedData(){
  if(!SEED){ toast('Keine Startdaten eingebaut'); return; }
  if(S.entries.length && !confirm('Startdaten zu den vorhandenen Einträgen hinzufügen?')) return;
  const ops=[]; const have=new Set(S.entries.map(e=>[e.art,e.kat,e.name,e.betrag,e.wer,e.ab].join('|')));
  SEED.entries.forEach(e=>{ if(!have.has([e.art,e.kat,e.name,e.betrag,e.wer,e.ab].join('|'))) ops.push({col:'entries',id:uid(),obj:e}); });
  Object.entries(SEED.lohn).forEach(([k,o])=>{ if(!S.lohn[k]) ops.push(...lohnOps(k,o)); });
  if(!ops.length){ toast('Alles schon vorhanden'); return; }
  await backend.batch(ops); logEv('Startdaten',ops.length+' Einträge geladen'); toast(ops.length+' Einträge geladen');
}
function exportData(){
  const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),entries:S.entries,lohn:S.lohn,frozen:S.frozen,settings:S.settings},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='budget-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function importData(file){
  try{
    const d=JSON.parse(await file.text()); const ops=[];
    const have=new Set(S.entries.map(e=>[e.art,e.kat,e.name,e.betrag,e.wer,e.ab].join('|')));
    (d.entries||[]).forEach(e=>{ const {id,...o}=e; if(!have.has([o.art,o.kat,o.name,o.betrag,o.wer,o.ab].join('|'))) ops.push({col:'entries',id:id||uid(),obj:o}); });
    Object.entries(d.lohn||{}).forEach(([k,o])=>ops.push(...lohnOps(k,o)));
    Object.entries(d.frozen||{}).forEach(([k,o])=>{ if(!S.frozen[k]) ops.push(...freezeOps(k,o)); });
    if(d.settings&&d.settings.kats) ops.push({col:'settings',id:'main',obj:{...S.settings,...d.settings}});
    if(!ops.length){ toast('Nichts zu importieren'); return; }
    await backend.batch(ops); logEv('Import',ops.length+' Einträge aus Datei importiert'); toast(ops.length+' Einträge importiert');
  }catch(e){ toast('Datei konnte nicht gelesen werden'); }
}
async function refreezeMonth(k){
  const l=lohnBase(k);
  await backend.batch(freezeOps(k,{key:k,items:liveItems(k),lohnN:l.n,lohnV:l.v,at:Date.now()}));
  logEv('Neu berechnet',label(k)+' aus den laufenden Einträgen neu gebildet');
  toast(label(k)+' neu berechnet');
}
async function saveLohn(k,p,val){
  if(p==='n' && !isAdmin()) return;
  if(!isAdmin() && S.frozen[k]) return;
  const empty = val===''||val==null||isNaN(val);
  const old=(S.lohn[k]||{})[p];
  const col = p==='n'?'lohn':'lohnV';
  if(empty) await backend.del(col,String(k)); else await backend.set(col,String(k),p==='n'?{n:val}:{v:val});
  logEv('Lohn',`${label(k)} ${p==='n'?'Nicola':'Vanessa'}: ${old==null||old===''?'–':fmt(+old)} → ${empty?'leer (Vormonat)':fmt(val)}`);
  if(!isAdmin()) return;
  // eingefrorene Monate ab k mit neuen Lohnwerten nachziehen
  setTimeout(async()=>{
    const ops=[]; Object.keys(S.frozen).map(Number).filter(x=>x>=k).forEach(x=>{
      const l=lohnBase(x), fr=S.frozen[x]; if(fr.lohnN!==l.n||fr.lohnV!==l.v) ops.push(...freezeOps(x,{...fr,lohnN:l.n,lohnV:l.v}));
    });
    if(ops.length) await backend.batch(ops);
  },200);
}


async function startBackend(){
  backend.onReady=async()=>{ ready=true; ui.phase='app'; await migrate(); await autoFreeze(); render(); };
  await backend.start(onData, err=>{
    if(err.code==='permission-denied'){ ui.phase='denied'; render(); }
    else { ui.err='Fehler: '+(err.code||err.message); render(); }
  });
}
async function boot(){
  render();
  let cfg=null;
  try{ cfg=JSON.parse(lsGet('budget_fbconfig','null')); }catch{ cfg=null; }
  if(!cfg && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) cfg=FIREBASE_CONFIG;
  const mode=lsGet('budget_mode');
  if(mode==='local'){ backend=LocalBackend(); ui.phase='loading'; await startBackend(); return; }
  if(!cfg){ ui.phase='setup'; render(); return; }
  try{
    ui.phase='loading'; ui.err=''; render();
    backend=await FirebaseBackend(cfg);
    backend.onAuth(async u=>{
      ui.user=u;
      if(!u){ ui.phase='login'; ready=false; render(); return; }
      ui.phase='loading'; render();
      await startBackend();
    });
  }catch(e){ ui.phase='setup'; ui.err='Verbindung fehlgeschlagen: '+(e.code||e.message); render(); }
}
/* ============ Export (CSV / PDF) ============ */
function reportData(period, sc){
  const adm=isAdmin(); if(!adm) sc='VS';
  const who=scopeLabel[sc], num=n=>Math.round(n*100)/100;
  const secs=[]; let title, sub;
  const agg=(mds)=>{
    const m={};
    mds.forEach(md=>md.items.forEach(it=>{
      const a=itemAmt(it,sc); if(a<=0.004) return;
      const k=[it.kat,it.name,it.art,it.wer].join('|'); (m[k]=m[k]||{kat:it.kat,name:it.name,art:it.art,wer:it.wer,sum:0}).sum+=a;
    }));
    return Object.values(m).sort((a,b)=>cats().concat(['Lohn']).indexOf(a.kat)-cats().concat(['Lohn']).indexOf(b.kat) || b.sum-a.sum);
  };
  if(period==='year'){
    const y=ui.year, rows=yearData(y), mds=rows.map(r=>monthData(r.k));
    title=`Haushaltsbudget ${y}`; sub=who;
    const P=r=>pick(r.c,sc);
    const tot=f=>rows.reduce((a,r)=>a+P(r)[f],0);
    secs.push({title:'Monatsübersicht (CHF)', head:['Monat','Einnahmen','Monatl. Ausgaben','Einmalige Ausgaben','Steuerkonto','Sparkonto'],
      rows:rows.map(r=>[MONTHS[r.m-1]+(r.frozen?'':' (geplant)'),P(r).ein,P(r).mon,P(r).einm,P(r).steuer,P(r).spar].map((v,i)=>i?num(v):v)),
      foot:['Total',...['ein','mon','einm','steuer','spar'].map(f=>num(tot(f)))]});
    const ct={}; mds.forEach(md=>{ const c=calc(md); Object.entries(c.cat).forEach(([k,o])=>ct[k]=(ct[k]||0)+(sc==='NJ'?o.n:sc==='VS'?o.v:o.n+o.v)); });
    const cr=Object.entries(ct).filter(([,v])=>v>0.004).sort((a,b)=>b[1]-a[1]);
    secs.push({title:'Ausgaben nach Kategorie (inkl. Steuerkonto-Anteil)', head:['Kategorie','CHF'], rows:cr.map(([k,v])=>[k,num(v)]), foot:['Total',num(cr.reduce((a,[,v])=>a+v,0))]});
    const pos=agg(mds);
    secs.push({title:'Positionen im Jahr', head:['Kategorie','Beschreibung','Art','Wer','CHF im Jahr'], rows:pos.map(p=>[p.kat,p.name,p.art==='Lohn'?'Einnahme':p.art,WERN[p.wer],num(p.sum)])});
  } else {
    const k=ui.key, md=monthData(k), c=calc(md), P=pick(c,sc);
    title=`Haushaltsbudget ${label(k)}`; sub=who+(md.frozen?' · eingefroren':' · laufend berechnet');
    secs.push({title:'Übersicht (CHF)', head:['Position','CHF'], rows:[['Einnahmen',P.ein],['Monatliche Ausgaben',P.mon],['Einmalige Ausgaben',P.einm],['Buchung ans Steuerkonto (Jahreskosten ÷ 12)',P.steuer],['Buchung ins Sparkonto',P.spar]].map(([a,b])=>[a,num(b)])});
    const pos=agg([md]);
    secs.push({title:'Positionen', head:['Kategorie','Beschreibung','Art','Wer','CHF im Monat'], rows:pos.map(p=>[p.kat,p.name,p.art==='Lohn'?'Einnahme':p.art,WERN[p.wer],num(p.sum)])});
  }
  return {title,sub,secs};
}
function reportCsv(r){
  const q=v=>{ const t=String(v); return /[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const out=[r.title+' · '+r.sub+' · erstellt '+new Date().toLocaleDateString('de-CH'),''];
  r.secs.forEach(s=>{ out.push(q(s.title)); out.push(s.head.map(q).join(';')); s.rows.forEach(x=>out.push(x.map(q).join(';'))); if(s.foot) out.push(s.foot.map(q).join(';')); out.push(''); });
  return '﻿'+out.join('\r\n');
}
function reportHtml(r){
  const cell=(v,h)=>`<${h?'th':'td'} ${typeof v==='number'?'class="r"':''}>${typeof v==='number'?fmt(v):esc(v)}</${h?'th':'td'}>`;
  return `<h1>${esc(r.title)}</h1><p class="sub">${esc(r.sub)} · erstellt ${new Date().toLocaleDateString('de-CH')}</p>`+
    r.secs.map(s=>`<h2>${esc(s.title)}</h2><table><tr>${s.head.map(h=>`<th ${/CHF|Einn|Ausg|Steuer|Spar/.test(h)&&h!=='Position'?'class="r"':''}>${esc(h)}</th>`).join('')}</tr>${s.rows.map(x=>`<tr>${x.map(v=>cell(v)).join('')}</tr>`).join('')}${s.foot?`<tr class="tot">${s.foot.map(v=>cell(v)).join('')}</tr>`:''}</table>`).join('');
}
function openExport(){
  const adm=isAdmin(), m=$('#modal');
  m.innerHTML=`<div class="sheet"><h3>Export</h3>
   <div class="two-c"><label class="f">Zeitraum<select id="xp"><option value="year">Jahr ${ui.year}</option><option value="month">Monat ${label(ui.key)}</option></select></label>
   ${adm?`<label class="f">Person<select id="xs">${[['all','Haushalt'],['NJ','Nicola'],['VS','Vanessa']].map(([v,l])=>`<option value="${v}" ${ui.scope===v?'selected':''}>${l}</option>`).join('')}</select></label>`:'<label class="f">Person<select disabled><option>Vanessa</option></select></label>'}</div>
   <div class="hint">Excel öffnet die CSV-Datei direkt. Für ein PDF im Druckdialog «Als PDF speichern» wählen.</div>
   <div class="actions"><button class="btn grow" type="button" data-xcsv>Excel (CSV)</button><button class="btn grow" type="button" data-xpdf>PDF / Drucken</button><button class="btn sec" type="button" data-close>Abbrechen</button></div></div>`;
  m.classList.add('on');
  const get=()=>reportData($('#xp').value, adm?$('#xs').value:'VS');
  $('[data-close]',m).onclick=closeModal;
  $('[data-xcsv]',m).onclick=()=>{
    const r=get(); const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([reportCsv(r)],{type:'text/csv;charset=utf-8'}));
    a.download=r.title.replace(/\s+/g,'_')+'_'+r.sub.split(' ')[0]+'.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    logEv('Export','CSV: '+r.title+' · '+r.sub); closeModal(); toast('CSV erstellt');
  };
  $('[data-xpdf]',m).onclick=()=>{
    const r=get(); let p=$('#print'); if(!p){ p=document.createElement('div'); p.id='print'; document.body.appendChild(p); }
    p.innerHTML=reportHtml(r); const old=document.title; document.title=r.title+' '+r.sub;
    logEv('Export','PDF: '+r.title+' · '+r.sub); closeModal();
    setTimeout(()=>{ window.print(); document.title=old; },80);
  };
}
