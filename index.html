<style>

nav.tabs button.on{color:var(--brand);font-weight:600}

.mnav{display:flex;align-items:center;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}

.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.seg button.on.nj{background:var(--nic)} .seg button.on.vs{background:var(--van)}

.sub3 b{display:block;font-size:14px;color:var(--text)}

.err{color:var(--red);font-size:13px;margin:4px 0}

textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12px}

</head>

    entries:Object.entries(cache.entries).map(([id,o])=>({...o,id})),
    lohn:{...cache.lohn}, frozen:{...cache.frozen}, settings:cache.settings.main||{}
  });
  const ref = (col,id) => F.doc(db,'households',HOUSEHOLD,col,id);
  const clean = o => JSON.parse(JSON.stringify(o));
  let unsubs=[];
  const b = {
    mode:'firebase', user:null,
    onAuth(cb){ A.onAuthStateChanged(auth, u => { b.user=u; cb(u); }); },
    async signIn(){
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      try{ await A.signInWithPopup(auth,p); }
      catch(e){ if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)) await A.signInWithRedirect(auth,p); else throw e; }
    },
    async signOut(){ unsubs.forEach(u=>u()); unsubs=[]; await A.signOut(auth); },
    async start(onData,onError){
      b.onData=onData;
      for(const col of COLS){
        unsubs.push(F.onSnapshot(F.collection(db,'households',HOUSEHOLD,col), snap=>{
          snap.docChanges().forEach(ch=>{ if(ch.type==='removed') delete cache[col][ch.doc.id]; else cache[col][ch.doc.id]=ch.doc.data(); });
          loaded[col]=true; emit();
          if(COLS.every(c=>loaded[c])) b.onReady();
        }, err=>onError&&onError(err)));
      }
    },
    async set(col,id,obj){ await F.setDoc(ref(col,id), clean(obj)); },
    async del(col,id){ await F.deleteDoc(ref(col,id)); },
    async batch(ops){
      for(let i=0;i<ops.length;i+=400){
        const wb=F.writeBatch(db);
        ops.slice(i,i+400).forEach(op=>op.del?wb.delete(ref(op.col,op.id)):wb.set(ref(op.col,op.id),clean(op.obj)));
        await wb.commit();
      }
    },
  };
  return b;
}

/* ============ Rechenlogik (wie in der Excel-Datei) ============ */
const shares = w => ({n: w==='NJ'?1:w==='50/50'?.5:0, v: w==='VS'?1:w==='50/50'?.5:0});
const cats = () => (S.settings.kats && S.settings.kats.length) ? S.settings.kats : CATS_DEFAULT;
function isActive(e,k){
  if(e.ab==null) return false;
  const end = e.art==='Einmalig' ? e.ab : (e.bis==null ? Infinity : e.bis);
  return e.ab<=k && k<=end;
}
function status(e,k){
  if(e.ab==null) return 'off';
  if(isActive(e,k)) return 'on';
  const end = e.art==='Einmalig' ? e.ab : (e.bis==null ? Infinity : e.bis);
  return end<k ? 'past' : 'future';
}
function monthlyAmount(e){ return e.art==='Jährlich' ? e.betrag/12 : e.betrag; }
function liveItems(k){
  return S.entries.filter(e=>isActive(e,k)).map(e=>{
    const m=monthlyAmount(e), s=shares(e.wer);
    return {id:e.id, art:e.art, kat:e.art==='Lohn'?'Lohn':e.kat, name:e.name, betrag:e.betrag, wer:e.wer, n:m*s.n, v:m*s.v};
  });
}
function lohnBase(k){
  let n=0,v=0,kn=-1,kv=-1;
  for(const [kk,o] of Object.entries(S.lohn)){
    const key=+kk; if(key>k) continue;
    if(o.n!=null && o.n!=='' && key>kn){ kn=key; n=+o.n; }
    if(o.v!=null && o.v!=='' && key>kv){ kv=key; v=+o.v; }
  }
  return {n,v};
}
function monthData(k){
  if(S.frozen[k]) return {...S.frozen[k], frozen:true};
  const l=lohnBase(k);
  return {key:k, items:liveItems(k), lohnN:l.n, lohnV:l.v, frozen:false};
}
function calc(md){
  const z=()=>({ein:0,mon:0,einm:0,steuer:0,spar:0});
  const N=z(), V=z(), cat={};
  N.ein=md.lohnN||0; V.ein=md.lohnV||0;
  for(const it of md.items){
    if(it.art==='Lohn'){ N.ein+=it.n; V.ein+=it.v; continue; }
    const f = it.art==='Monatlich'?'mon':it.art==='Einmalig'?'einm':'steuer';
    N[f]+=it.n; V[f]+=it.v;
    const c=(cat[it.kat]=cat[it.kat]||{n:0,v:0}); c.n+=it.n; c.v+=it.v;
  }
  for(const P of [N,V]) P.spar=P.ein-P.mon-P.einm-P.steuer;
  const H={}; for(const f of ['ein','mon','einm','steuer','spar']) H[f]=N[f]+V[f];
  return {N,V,H,cat};
}
function firstKey(){
  const ks=[...S.entries.filter(e=>e.ab!=null).map(e=>e.ab), ...Object.keys(S.lohn).map(Number)];
  return ks.length ? Math.min(...ks) : null;
}
/* Vergangene Monate werden automatisch eingefroren: spaetere Aenderungen/Loeschungen aendern sie nicht mehr. */
async function autoFreeze(){
  if(!ready || !backend) return;
  const f=firstKey(); if(f==null) return;
  const cur=nowKey(); const ops=[];
  for(let k=f;k<cur;k++){
    if(S.frozen[k]) continue;
    const l=lohnBase(k);
    ops.push({col:'frozen', id:String(k), obj:{key:k, items:liveItems(k), lohnN:l.n, lohnV:l.v, at:Date.now()}});
  }
  if(ops.length){
    ops.forEach(o=>S.frozen[o.id]=o.obj);   // sofort lokal, damit nichts dazwischenkommt
    await backend.batch(ops);
  }
}

/* ============ Diagramm ============ */
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function chart(labels, series){
  const W=640,H=200,pl=44,pr=6,pt=10,pb=24;
  const all=series.flatMap(s=>s.values);
  let max=Math.max(1,...all), min=Math.min(0,...all);
  const step=niceStep((max-min)/4||1); max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step;
  const y=v=>pt+(H-pt-pb)*(max-v)/((max-min)||1);
  const n=labels.length, gw=(W-pl-pr)/n, bw=Math.min(22,(gw-6)/series.length);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=min; v<=max+1e-9; v+=step){
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${Math.abs(v)>=1000?(v/1000)+'k':v}</text>`;
  }
  labels.forEach((lb,i)=>{
    const cx=pl+gw*i+gw/2;
    series.forEach((se,j)=>{
      const v=se.values[i]; const x=cx-(series.length*bw)/2+j*bw;
      const y0=y(0), y1=y(v);
      s+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw-1}" height="${Math.max(0.5,Math.abs(y0-y1))}" rx="2" fill="${se.color}"><title>${esc(se.name)} ${esc(lb)}: ${chf(v)}</title></rect>`;
    });
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  s+='</svg><div class="legend">'+series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')+'</div>';
  return s;
}

      <div class="card"><h2>Vergleich</h2>${chart(ys.map(String),[
        {name:'Einnahmen',color:'#FFC000',values:data.map(d=>sumField(d.rows,sc,'ein'))},
        {name:'Ausgaben',color:'#70AD47',values:data.map(d=>sumField(d.rows,sc,'mon')+sumField(d.rows,sc,'einm')+sumField(d.rows,sc,'steuer'))},
        {name:'Sparkonto',color:'#2E75B6',values:data.map(d=>sumField(d.rows,sc,'spar'))}])}</div>`;
  }
  return h;
}

function viewMore(){
  const f=firstKey(), cur=nowKey();
  const frozenKeys=Object.keys(S.frozen).map(Number).sort((a,b)=>b-a);
  const user=backend&&backend.user;
  let h=`<div class="grid two"><div>
  <div class="card"><h2>Verbindung</h2>
    <p style="margin:0 0 8px">${backend&&backend.mode==='firebase'?`☁ Firebase · angemeldet als <b>${esc(user&&user.email||'')}</b>`:'💾 Lokaler Modus – Daten nur in diesem Browser'}</p>
    <div class="actions">${backend&&backend.mode==='firebase'?'<button class="btn sec sm" data-act="logout">Abmelden</button>':''}
    ${backend&&backend.mode==='local'?'<button class="btn sm" data-act="to-firebase">Mit Firebase verbinden</button>':'<button class="btn sec sm" data-act="to-local">Lokal testen</button>'}
    <button class="btn sec sm" data-act="reset-config">Firebase-Konfiguration ändern</button></div></div>
  <div class="card"><h2>Kategorien</h2>
    ${cats().map(c=>{const used=S.entries.some(e=>e.kat===c); return `<div class="kv" style="background:var(--bg)"><span>${esc(c)}</span>${used?'<small style="color:var(--muted)">in Verwendung</small>':`<button class="btn sec sm" data-delcat="${esc(c)}">Entfernen</button>`}</div>`;}).join('')}
    <form data-addcat class="actions"><input name="c" placeholder="Neue Kategorie" style="flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"><button class="btn sm">Hinzufügen</button></form></div>
  <div class="card"><h2>Backup</h2><div class="actions"><button class="btn sec sm" data-act="export">Daten exportieren (JSON)</button><label class="btn sec sm" style="cursor:pointer">Importieren<input type="file" accept="application/json" data-import hidden></label><button class="btn sec sm" data-act="seed">Startdaten laden</button></div>
  <div class="hint">Import und Startdaten fügen hinzu bzw. überschreiben gleiche Einträge nicht doppelt.</div></div>
  </div><div>
  <div class="card"><h2>Verlauf (eingefrorene Monate)</h2>
  <div class="hint">Vergangene Monate werden automatisch eingefroren. Danach kannst du Einträge löschen oder ändern, ohne dass sich alte Monate verändern. Neu berechnen = Monat nochmals aus den heutigen Einträgen und Löhnen bilden.</div>
  ${frozenKeys.length?frozenKeys.map(k=>`<div class="kv" style="background:var(--bg)"><span>🔒 ${label(k)}</span><button class="btn sec sm" data-refreeze="${k}">Neu berechnen</button></div>`).join(''):'<div class="empty">Noch keine Monate eingefroren (passiert automatisch ab dem nächsten Monat).</div>'}
  </div>
  <div class="card"><h2>Hinweise</h2><div class="hint" style="line-height:1.6">
   • <b>Monatlich</b>: läuft jeden Monat weiter, bis ein «Bis Monat» gesetzt ist.<br>
   • <b>Einmalig</b>: zählt nur im gewählten Monat.<br>
   • <b>Jährlich</b>: Jahresbetrag, wird ÷ 12 ans Steuerkonto gebucht.<br>
   • <b>Abo beenden</b>: Eintrag öffnen → «Ab diesem Monat beenden». Wieder abonniert? Neuen Eintrag anlegen.<br>
   • <b>Preis ändert sich</b>: Eintrag öffnen → «Betrag ab diesem Monat ändern».</div></div>
  </div></div>`;
  return h;
}

/* ============ Rendern ============ */
const TABS=[['month','🏠','Monat'],['entries','🧾','Einträge'],['lohn','💼','Löhne'],['year','📊','Jahr'],['more','⚙️','Mehr']];
function render(){
  const app=$('#app');
  if(ui.phase==='setup') return renderSetup(app);
  if(ui.phase==='login') return renderLogin(app);
  if(ui.phase==='boot'||ui.phase==='loading'){ app.innerHTML=`<div class="center"><div>${ui.err?esc(ui.err):'Lade …'}</div></div>`; return; }
  if(ui.phase==='denied'){ app.innerHTML=`<div class="center"><div class="card"><h2>Kein Zugriff</h2><p>${esc(ui.user&&ui.user.email||'')} ist für dieses Budget nicht freigeschaltet (Firestore-Regeln).</p><div class="actions"><button class="btn" data-act="logout">Mit anderem Konto anmelden</button></div></div></div>`; return; }
  const body = ui.tab==='month'?viewMonth(): ui.tab==='entries'?viewEntries(): ui.tab==='lohn'?viewLohn(): ui.tab==='year'?viewYear(): viewMore();
  const mode = backend&&backend.mode==='firebase' ? '<span class="pill ok">☁ synchronisiert</span>' : '<span class="pill">💾 lokal</span>';
  app.innerHTML=`<header class="top"><h1>Haushaltsbudget</h1>${mode}</header>
    <nav class="tabs">${TABS.map(([id,i,l])=>`<button class="${ui.tab===id?'on':''}" data-tab="${id}"><span class="i">${i}</span>${l}</button>`).join('')}</nav>${body}`;
}
function renderLogin(app){
  app.innerHTML=`<div class="center"><div style="font-size:44px">💶</div><h1 style="margin:0">Haushaltsbudget</h1><div class="card"><h2>Anmelden</h2><p>Die Daten sind privat und nur für freigeschaltete Konten sichtbar.</p><div class="actions"><button class="btn grow" data-act="login">Mit Google anmelden</button></div>${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}<div class="actions" style="margin-top:14px"><button class="btn sec sm" data-act="to-local">Lokal testen (ohne Anmeldung)</button><button class="btn sec sm" data-act="reset-config">Konfiguration ändern</button></div></div></div>`;
}
function renderSetup(app){
  app.innerHTML=`<div class="center"><div style="font-size:44px">💶</div><h1 style="margin:0">Haushaltsbudget</h1><div class="card"><h2>Firebase verbinden</h2>
  <p style="margin-top:0">Die App-ID ist schon hinterlegt. Es fehlen noch <code>apiKey</code> und <code>projectId</code>. In der Firebase-Konsole: Projekteinstellungen → Allgemein → Deine Apps → SDK-Konfiguration. Den ganzen <code>firebaseConfig</code>-Block hier einfügen:</p>
  <textarea id="cfgtxt" placeholder='const firebaseConfig = {\n  apiKey: "…",\n  authDomain: "…firebaseapp.com",\n  projectId: "…",\n  …\n};'></textarea>
  ${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}
  <div class="actions"><button class="btn" data-act="save-config">Verbinden</button><button class="btn sec" data-act="to-local">Erst lokal testen</button></div></div></div>`;
}

/* ============ Eintrag bearbeiten ============ */
function openEntry(id){
  const isNew=!id;
  const e=isNew?{art:'Monatlich',kat:cats()[0],name:'',betrag:'',wer:'50/50',ab:ui.key,bis:null}:{...S.entries.find(x=>x.id===id)};
  const m=$('#modal');
  const form=()=>`<div class="sheet"><h3>${isNew?'Neuer Eintrag':'Eintrag bearbeiten'}</h3>
  <form id="ef">
    <div class="two-c"><label class="f">Art<select name="art">${['Monatlich','Einmalig','Jährlich','Lohn'].map(a=>`<option value="${a}" ${e.art===a?'selected':''}>${a==='Lohn'?'Weitere Einnahme':a}</option>`).join('')}</select></label>
    <label class="f" data-katwrap>Kategorie<select name="kat">${[...new Set([...cats(),e.kat].filter(Boolean))].map(c=>`<option ${e.kat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
    <label class="f">Beschreibung<input name="name" value="${esc(e.name)}" placeholder="z. B. Netflix" autocomplete="off"></label>
    <div class="two-c"><label class="f"><span data-betrag>Betrag (CHF)</span><input name="betrag" type="number" step="0.05" inputmode="decimal" value="${e.betrag}" required></label>
    <label class="f">Wer zahlt<select name="wer">${[['NJ','Nicola'],['VS','Vanessa'],['50/50','50 / 50']].map(([v,l])=>`<option value="${v}" ${e.wer===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <div class="two-c"><label class="f"><span data-ablab>Ab Monat</span><input name="ab" type="month" value="${toInput(e.ab)}" required></label>
    <label class="f" data-biswrap>Bis Monat (leer = läuft weiter)<input name="bis" type="month" value="${toInput(e.bis)}"></label></div>
    <div class="hint" data-hint></div><div class="err" data-err></div>
    <div class="actions"><button class="btn grow" type="submit">Speichern</button><button class="btn sec" type="button" data-close>Abbrechen</button></div>
    ${isNew?'':`<div class="actions" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      ${e.art!=='Einmalig'?`<button class="btn sec sm" type="button" data-end>Ab ${label(ui.key)} beenden</button><button class="btn sec sm" type="button" data-newamt>Betrag ab ${label(ui.key)} ändern</button>`:''}
      <button class="btn danger sm" type="button" data-del>Löschen</button></div>`}
  </form></div>`;
  m.innerHTML=form(); m.classList.add('on');
  const f=$('#ef');
  const sync=()=>{
    const art=f.art.value;
    $('[data-katwrap]',f).style.display=art==='Lohn'?'none':'';
    $('[data-biswrap]',f).style.display=art==='Einmalig'?'none':'';
    $('[data-ablab]',f).textContent=art==='Einmalig'?'Monat':'Ab Monat';
    $('[data-betrag]',f).textContent=art==='Jährlich'?'Jahresbetrag (CHF)':'Betrag (CHF)';
    const ab=fromInput(f.ab.value);
    $('[data-hint]',f).textContent = art==='Jährlich'&&f.betrag.value?`= ${chf(f.betrag.value/12)} pro Monat ans Steuerkonto`: (ab&&ab<nowKey()?'Vergangene Monate sind eingefroren und ändern sich nicht.':'');
  };
  f.addEventListener('input',sync); f.addEventListener('change',sync); sync();
  $('[data-close]',f).onclick=closeModal;
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const betrag=parseFloat(f.betrag.value), ab=fromInput(f.ab.value); let bis=f.art.value==='Einmalig'?null:fromInput(f.bis.value);
    const err=$('[data-err]',f);
    if(!(betrag>=0)){ err.textContent='Bitte einen Betrag eingeben.'; return; }
    if(ab==null){ err.textContent='Bitte einen Monat wählen.'; return; }
    if(bis!=null && bis<ab){ err.textContent='«Bis Monat» liegt vor «Ab Monat».'; return; }
    const obj={art:f.art.value, kat:f.art.value==='Lohn'?'Lohn':f.kat.value, name:f.name.value.trim(), betrag, wer:f.wer.value, ab, bis};
    await autoFreeze();
    await backend.set('entries', e.id||uid(), obj);
    closeModal(); toast('Gespeichert');
  };
  if(!isNew){
    $('[data-del]',f).onclick=async()=>{ if(!confirm(`«${e.name||'Eintrag'}» wirklich löschen?\nVergangene (eingefrorene) Monate bleiben unverändert.`)) return; await autoFreeze(); await backend.del('entries',e.id); closeModal(); toast('Gelöscht'); };
    const end=$('[data-end]',f); if(end) end.onclick=async()=>{
      if(e.ab>=ui.key){ if(!confirm('Der Eintrag beginnt erst in diesem Monat oder später. Ganz löschen?')) return; await autoFreeze(); await backend.del('entries',e.id); }
      else { await autoFreeze(); const o={...e}; delete o.id; o.bis=ui.key-1; await backend.set('entries',e.id,o); }
      closeModal(); toast('Beendet');
    };
    const na=$('[data-newamt]',f); if(na) na.onclick=async()=>{
      const v=prompt(`Neuer Betrag ab ${label(ui.key)} (bisher ${fmt(e.betrag)}):`); if(v==null) return;
      const nb=parseFloat(String(v).replace(',','.').replace(/[’' ]/g,'')); if(!(nb>=0)){ toast('Ungültiger Betrag'); return; }
      if(e.ab>=ui.key){ const o={...e,betrag:nb}; delete o.id; await autoFreeze(); await backend.set('entries',e.id,o); }
      else { await autoFreeze(); const oldO={...e}; delete oldO.id; oldO.bis=ui.key-1; const newO={...oldO,betrag:nb,ab:ui.key,bis:e.bis}; await backend.batch([{col:'entries',id:e.id,obj:oldO},{col:'entries',id:uid(),obj:newO}]); }
      closeModal(); toast('Betrag geändert');
    };
  }
}
function closeModal(){ const m=$('#modal'); m.classList.remove('on'); m.innerHTML=''; }

/* ============ Aktionen ============ */
async function seedData(){
  if(!SEED){ toast('Keine Startdaten eingebaut'); return; }
  if(S.entries.length && !confirm('Startdaten zu den vorhandenen Einträgen hinzufügen?')) return;
  const ops=[]; const have=new Set(S.entries.map(e=>[e.art,e.kat,e.name,e.betrag,e.wer,e.ab].join('|')));
  SEED.entries.forEach(e=>{ if(!have.has([e.art,e.kat,e.name,e.betrag,e.wer,e.ab].join('|'))) ops.push({col:'entries',id:uid(),obj:e}); });
  Object.entries(SEED.lohn).forEach(([k,o])=>{ if(!S.lohn[k]) ops.push({col:'lohn',id:k,obj:o}); });
  if(!ops.length){ toast('Alles schon vorhanden'); return; }
  await backend.batch(ops); toast(ops.length+' Einträge geladen');
}
function exportData(){
  const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),entries:S.entries,lohn:S.lohn,frozen:S.frozen,settings:S.settings},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='budget-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function importData(file){
  try{
    const d=JSON.parse(await file.text()); const ops=[];
    const have=new Set(S.entries.map(e=>[e.art,e.kat,e.name,e.betrag,e.wer,e.ab].join('|')));
    (d.entries||[]).forEach(e=>{ const {id,...o}=e; if(!have.has([o.art,o.kat,o.name,o.betrag,o.wer,o.ab].join('|'))) ops.push({col:'entries',id:id||uid(),obj:o}); });
    Object.entries(d.lohn||{}).forEach(([k,o])=>ops.push({col:'lohn',id:k,obj:o}));
    Object.entries(d.frozen||{}).forEach(([k,o])=>{ if(!S.frozen[k]) ops.push({col:'frozen',id:k,obj:o}); });
    if(d.settings&&d.settings.kats) ops.push({col:'settings',id:'main',obj:{...S.settings,...d.settings}});
    if(!ops.length){ toast('Nichts zu importieren'); return; }
    await backend.batch(ops); toast(ops.length+' Einträge importiert');
  }catch(e){ toast('Datei konnte nicht gelesen werden'); }
}
async function refreezeMonth(k){
  const l=lohnBase(k);
  await backend.set('frozen',String(k),{key:k,items:liveItems(k),lohnN:l.n,lohnV:l.v,at:Date.now()});
  toast(label(k)+' neu berechnet');
}
async function saveLohn(k,p,val){
  const o={...(S.lohn[k]||{})};
  if(val===''||val==null||isNaN(val)) delete o[p]; else o[p]=val;
  if(o.n==null && o.v==null) await backend.del('lohn',String(k)); else await backend.set('lohn',String(k),{n:o.n??null,v:o.v??null});
  // eingefrorene Monate ab k mit neuen Lohnwerten nachziehen
  setTimeout(async()=>{
    const ops=[]; Object.keys(S.frozen).map(Number).filter(x=>x>=k).forEach(x=>{
      const l=lohnBase(x), fr=S.frozen[x]; if(fr.lohnN!==l.n||fr.lohnV!==l.v) ops.push({col:'frozen',id:String(x),obj:{...fr,lohnN:l.n,lohnV:l.v}});
    });
    if(ops.length) await backend.batch(ops);
  },200);
}

/* ============ Ereignisse ============ */
document.addEventListener('click', async ev=>{
  const t=ev.target.closest('[data-tab],[data-scope],[data-mshift],[data-yshift],[data-yview],[data-edit],[data-act],[data-refreeze],[data-delcat]');
  if(!t){ if(ev.target.id==='modal') closeModal(); return; }
  const d=t.dataset;
  if(d.tab){ ui.tab=d.tab; render(); window.scrollTo(0,0); }
  else if(d.scope){ ui.scope=d.scope; lsSet('budget_scope',d.scope); render(); }
  else if(d.mshift){ ui.key+=+d.mshift; ui.year=ymOf(ui.key).y; render(); }
  else if(d.yshift){ ui.year+=+d.yshift; render(); }
  else if(d.yview){ ui.yview=d.yview; render(); }
  else if(d.edit){ openEntry(d.edit); }
  else if(d.refreeze){ await refreezeMonth(+d.refreeze); }
  else if(d.delcat){ const next=cats().filter(c=>c!==d.delcat); await backend.set('settings','main',{...S.settings,kats:next}); }
  else if(d.act){
    const a=d.act;
    if(a==='add') openEntry(null);
    else if(a==='seed') await seedData();
    else if(a==='export') exportData();
    else if(a==='login'){ try{ ui.err=''; await backend.signIn(); }catch(e){ ui.err='Anmeldung fehlgeschlagen: '+(e.code||e.message); render(); } }
    else if(a==='logout'){ await backend.signOut(); ui.phase='login'; ready=false; render(); }
    else if(a==='to-local'){ lsSet('budget_mode','local'); location.reload(); }
    else if(a==='to-firebase'){ lsDel('budget_mode'); location.reload(); }
    else if(a==='reset-config'){ lsDel('budget_fbconfig'); lsDel('budget_mode'); ui.phase='setup'; ui.err=''; render(); }
    else if(a==='save-config'){
      const txt=$('#cfgtxt').value; const cfg={...FIREBASE_CONFIG};
      for(const m of txt.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g)) cfg[m[1]]=m[2];
      if(!cfg.apiKey||!cfg.projectId){ ui.err='apiKey und projectId fehlen noch im eingefügten Text.'; render(); return; }
      if(!cfg.authDomain) cfg.authDomain=cfg.projectId+'.firebaseapp.com';
      lsSet('budget_fbconfig',JSON.stringify(cfg)); lsDel('budget_mode'); location.reload();
    }
  }
});
document.addEventListener('change', async ev=>{
  const t=ev.target;
  if(t.matches('[data-mpick]')){ const k=fromInput(t.value); if(k){ ui.key=k; ui.year=ymOf(k).y; render(); } }
  else if(t.matches('[data-filter]')){ ui.filterKat=t.value; render(); }
  else if(t.matches('[data-only]')){ ui.onlyActive=t.checked; render(); }
  else if(t.matches('[data-import]')){ if(t.files[0]) await importData(t.files[0]); t.value=''; }
  else if(t.matches('input[data-lohn]')){ const v=t.value===''?'':parseFloat(t.value); await saveLohn(+t.dataset.lohn,t.dataset.p,v); }
});
document.addEventListener('submit', async ev=>{
  if(ev.target.matches('[data-addcat]')){
    ev.preventDefault(); const c=ev.target.c.value.trim(); if(!c) return;
    if(cats().includes(c)){ toast('Gibt es schon'); return; }
    await backend.set('settings','main',{...S.settings,kats:[...cats(),c]});
  }
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape') closeModal(); });

/* ============ Start ============ */
function onData(d){
  S=d;
  const a=document.activeElement;
  if(a && a.matches && a.matches('input[data-lohn]')){ clearTimeout(onData.t); onData.t=setTimeout(render,600); return; }
  if(ui.phase==='loading') ui.phase='app';
  render();
}
async function startBackend(){
  backend.onReady=async()=>{ ready=true; ui.phase='app'; await autoFreeze(); render(); };
  await backend.start(onData, err=>{
    if(err.code==='permission-denied'){ ui.phase='denied'; render(); }
    else { ui.err='Fehler: '+(err.code||err.message); render(); }
  });
}
async function boot(){
  render();
  let cfg=null;
  try{ cfg=JSON.parse(lsGet('budget_fbconfig','null')); }catch{ cfg=null; }
  if(!cfg && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) cfg=FIREBASE_CONFIG;
  const mode=lsGet('budget_mode');
  if(mode==='local'){ backend=LocalBackend(); ui.phase='loading'; await startBackend(); return; }
  if(!cfg){ ui.phase='setup'; render(); return; }
  try{
    ui.phase='loading'; ui.err=''; render();
    backend=await FirebaseBackend(cfg);
    backend.onAuth(async u=>{
      ui.user=u;
      if(!u){ ui.phase='login'; ready=false; render(); return; }
      ui.phase='loading'; render();
      await startBackend();
    });
  }catch(e){ ui.phase='setup'; ui.err='Verbindung fehlgeschlagen: '+(e.code||e.message); render(); }
}
boot();
</script>
